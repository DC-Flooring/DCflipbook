let toastTimer = null;
function hideToast(){ clearTimeout(toastTimer); const t = document.getElementById('toast'); t.hidden = true; t.innerHTML = ''; }
function showToast(msg, undo){
  const t = document.getElementById('toast');
  t.innerHTML = `<span class="toast-msg">${escapeHtml(msg)}</span>${undo ? '<button type="button" class="toast-undo">Undo</button>' : ''}`;
  t.hidden = false;
  if(undo) t.querySelector('.toast-undo').onclick = ()=>{ hideToast(); undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, TOAST_MS);
}
// repaint whatever is showing after a quote changed (badge, lists, editor summary)
function afterQuoteChange(q, fields){
  Object.assign(q, fields);
  if(draft && draft.ref === q.ref){ Object.assign(draft, fields); refreshEditorMeta(); }
  const all = quoteCache || [];
  refreshBadge(all);
  if(adminView === 'dashboard') renderDashboard(all);
  else if(adminView === 'quotes' || adminView === 'reminders') renderList(false);
}
function refreshEditorMeta(){
  if(!draft) return;
  const v = document.getElementById('f-valid'); if(v) v.value = draft.validUntil || '';
  const pill = document.getElementById('edPill'); if(pill) pill.innerHTML = pillHtml(draft, 'margin-left:8px;');
  const info = document.getElementById('chaseInfo'); if(info) info.textContent = chaseDetail(draft);
}
// Writes `fields` to Supabase first; only when that works does the screen change. Undo writes the old values back.
async function changeQuote(ref, fields, message){
  const q = (quoteCache || []).find(x=> x.ref === ref);
  if(!q) return;
  const prev = {};
  Object.keys(fields).forEach(k=>{ prev[k] = q[k]; });
  if(!(await patchQuote(ref, fields))){ showToast("Couldn't save that. Please try again."); return; }
  afterQuoteChange(q, fields);
  showToast(message, async ()=>{
    if(!(await patchQuote(ref, prev))){ showToast("Couldn't undo that. Please try again."); return; }
    afterQuoteChange(q, prev);
  });
}
const chaseFields = ()=>({ lastChasedAt: new Date().toISOString(), snoozedUntil: new Date(Date.now() + CHASE_SNOOZE_DAYS * DAY_MS).toISOString() });
const markChased = q => changeQuote(q.ref, chaseFields(), `Marked ${quoteName(q)} as chased. Hidden from the lists for ${plural(CHASE_SNOOZE_DAYS, 'day')}.`);
function extendTo(q, date){
  return changeQuote(q.ref, { validUntil: date }, `Extended ${quoteName(q)} to ${longDate(date + 'T00:00:00')}.`);
}
function closeMenus(except){
  document.querySelectorAll('.menu-wrap.open').forEach(w=>{
    if(w === except) return;
    w.classList.remove('open'); w.querySelector('.menu').hidden = true; w.querySelector('[data-menu]').setAttribute('aria-expanded', 'false');
  });
}
// One handler for every list that carries these buttons (Needs attention, Reminders). Resolves true if the click was theirs.
async function onCardActionClick(e){
  const snz = e.target.closest('[data-snz]');
  if(snz){
    e.stopPropagation();
    showSnoozed[snz.dataset.snz] = !showSnoozed[snz.dataset.snz];
    const all = quoteCache || [];
    if(adminView === 'dashboard') renderDashboard(all); else renderList(false);
    return true;
  }
  const tgl = e.target.closest('[data-menu]');
  if(tgl){
    e.stopPropagation();
    const w = tgl.closest('.menu-wrap'), open = !w.classList.contains('open');
    closeMenus(w);
    w.classList.toggle('open', open); w.querySelector('.menu').hidden = !open; tgl.setAttribute('aria-expanded', String(open));
    return true;
  }
  const b = e.target.closest('[data-act]');
  if(!b){
    if(e.target.closest('.card-actions, .snz')){ e.stopPropagation(); return true; }     // padding / the date field: don't open the quote
    return false;
  }
  e.stopPropagation();
  closeMenus();
  const q = (quoteCache || []).find(x=> x.ref === b.dataset.ref);
  if(!q) return true;
  const days = +b.dataset.days;
  if(b.dataset.act === 'chase') await markChased(q);
  else if(b.dataset.act === 'snooze'){
    const label = (SNOOZE_OPTIONS.find(([d])=> d === days) || [])[1] || plural(days, 'day');
    await changeQuote(q.ref, { snoozedUntil: new Date(Date.now() + days * DAY_MS).toISOString() }, `Snoozed ${quoteName(q)} for ${label}.`);
  }
  else if(b.dataset.act === 'extend') await extendTo(q, addDays(laterOf(todayLondon(), q.validUntil), days));
  else if(b.dataset.act === 'unsnooze') await changeQuote(q.ref, { snoozedUntil: null }, `Brought ${quoteName(q)} back.`);
  return true;
}
const laterOf = (a, b)=> (b && b > a) ? b : a;
async function onPickChange(e){
  const inp = e.target.closest('input[data-pick]');
  if(!inp) return;
  const q = (quoteCache || []).find(x=> x.ref === inp.dataset.ref), date = inp.value;
  if(!q || !date) return;
  closeMenus();
  if(date < todayLondon() || date <= (q.validUntil || '')){
    showToast(`Pick a date after ${longDate(laterOf(todayLondon(), q.validUntil) + 'T00:00:00')}.`);
    renderCurrentLists();
    return;
  }
  await extendTo(q, date);
}
function renderCurrentLists(){
  const all = quoteCache || [];
  if(adminView === 'dashboard') renderDashboard(all);
  else if(adminView === 'quotes' || adminView === 'reminders') renderList(false);
}
document.addEventListener('click', e=>{ if(!e.target.closest('.menu-wrap')) closeMenus(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeMenus(); });

function emptyListHtml(){
  const term = searchTerm.trim();
  if(term) return `<div class="empty-list"><strong>No quotes found</strong><br>Nothing matches “${escapeHtml(term)}”.</div>`;
  if(listTab === 'reminders') return `<div class="empty-list">Nothing to chase right now. Sent quotes show up here once they've been waiting more than ${settings.reminderDays} days. Quotes you've chased or snoozed stay out of the way until the snooze ends.</div>`;
  if(statusFilter !== 'all'){
    const msg = { awaiting:'No quotes awaiting a reply', accepted:'No accepted quotes yet', declined:'No declined quotes yet', expired:'No expired quotes', draft:'No draft quotes' }[statusFilter];
    return `<div class="empty-list"><strong>${escapeHtml(msg)}</strong>${filterFrom || filterTo ? '<br>Try widening the date range.' : ''}</div>`;
  }
  return '<div class="empty-list">No quotes match — create one or adjust your filters.</div>';
}

// the status chips show how many quotes each would list, given Show hidden, the date range and the search box
function renderStatusChips(all){
  const base = visibleQuotes(all, true);
  document.getElementById('statusChips').innerHTML = STATUS_FILTERS.map(([k, label])=>{
    const n = base.filter(q=> matchesStatus(q, k)).length, on = k === statusFilter;
    return `<button type="button" class="chip${on ? ' active' : ''}" data-status="${k}" aria-pressed="${on}">${label}<span class="chip-n">${n}</span></button>`;
  }).join('');
}
async function setStatusFilter(k){
  if(k === statusFilter) return;
  statusFilter = k;
  selectedRefs.clear();
  history.pushState(null, '', '/' + viewHash('quotes'));
  await renderList(false);
  const chip = document.querySelector(`#statusChips .chip[data-status="${k}"]`);
  if(chip) chip.focus();
}
async function renderList(force = true){
  const all = await loadQuotes(force);
  if(adminView === null) return;                        // signed out while this was loading
  const allReminders = refreshBadge(all);
  syncListUi();

  const el = document.getElementById('qList');
  if(listTab === 'reminders'){
    const term = searchTerm.trim().toLowerCase();
    const reminders = term ? allReminders.filter(q=> matchesSearch(q, term)) : allReminders;
    const snoozedList = snoozedReminders(all).filter(q=> !term || matchesSearch(q, term));
    const snoozedHtml = snoozedBlockHtml('rem', snoozedList);
    if(!reminders.length){ el.innerHTML = emptyListHtml() + snoozedHtml; return; }
    const reminderCard = q=>{
      const days = Math.floor(quoteAgeDays(q));
      return `<div class="qcard ${q.ref===currentRef?'active':''}" data-ref="${escapeHtml(q.ref)}">
        <div class="row1">
          <div class="row1-left"><span class="ref">${escapeHtml(q.ref)}</span></div>
          <div class="row1-right">${viewBadgeHtml(q)}${isQuoteExpired(q) ? pillHtml(q) : ''}<span class="waiting">Waiting ${days} day${days===1?'':'s'}</span></div>
        </div>
        <div class="name">${escapeHtml(q.customerName)||'Unnamed customer'}</div>
        <div class="row3"><span class="total">${money(calcTotals(q).total)}</span></div>
        ${q.lastChasedAt ? `<div class="chased">${escapeHtml(chasedLabel(q))}</div>` : ''}
        <button class="copy-fu-btn" data-ref="${escapeHtml(q.ref)}">Copy follow-up message</button>
        ${cardActionsHtml(q, false)}
      </div>`;
    };
    const sections = [
      ['Never opened', reminders.filter(q=> !q.viewCount)],
      ['Opened, no decision', reminders.filter(q=> q.viewCount > 0)]
    ].filter(([, list])=> list.length);
    el.innerHTML = sections.map(([title, list])=>
      `<div class="list-section"><span>${title}</span><span>${list.length}</span></div>${list.map(reminderCard).join('')}`
    ).join('') + snoozedHtml;
    Array.from(el.querySelectorAll('.qcard')).forEach(c=>{
      c.addEventListener('click', e=>{ if(!e.target.closest('.card-actions')) openQuote(c.dataset.ref); });
    });
    Array.from(el.querySelectorAll('.copy-fu-btn')).forEach(btn=>{
      btn.addEventListener('click', async e=>{
        e.stopPropagation();
        const q = reminders.find(r=> r.ref === btn.dataset.ref);
        if(q) await copyFollowUp(q, btn);
      });
    });
    Array.from(el.querySelectorAll('.snz-row')).forEach(r=>{
      r.addEventListener('click', e=>{ if(!e.target.closest('button')) openQuote(r.dataset.ref); });
    });
    return;
  }

  renderStatusChips(all);
  const quotes = visibleQuotes(all);
  // drop selections for refs no longer in the visible (filtered) list
  const visibleRefs = new Set(quotes.map(q=>q.ref));
  Array.from(selectedRefs).forEach(r=>{ if(!visibleRefs.has(r)) selectedRefs.delete(r); });

  const bulkBar = document.getElementById('bulkBar');
  const selectAllChk = document.getElementById('selectAllChk');
  if(!quotes.length){
    el.innerHTML = emptyListHtml();
    bulkBar.style.display = 'none';
    selectAllChk.checked = false; selectAllChk.indeterminate = false;
    return;
  }

  bulkBar.style.display = selectedRefs.size ? 'flex' : 'none';
  document.getElementById('bulkCount').textContent = selectedRefs.size;
  selectAllChk.checked = selectedRefs.size === quotes.length;
  selectAllChk.indeterminate = selectedRefs.size > 0 && selectedRefs.size < quotes.length;

  el.innerHTML = quotes.map(q=>{
    const {total} = calcTotals(q);
    let reasonHtml = '';
    if(q.status==='declined' && reasonLine(q.response)){
      reasonHtml = `<div class="reason" title="${escapeHtml(reasonPlain(q.response))}">${reasonLine(q.response)}</div>`;
    }else if(q.status==='declined' && staffNote(q)){
      reasonHtml = `<div class="reason" title="${escapeHtml(staffNote(q))}">“${escapeHtml(staffNote(q))}”</div>`;
    }
    const staffHtml = isStaffRecorded(q) ? `<div class="staff-tag">${escapeHtml(staffLabel(q))}</div>` : '';
    return `<div class="qcard ${q.ref===currentRef?'active':''} ${q.hidden?'is-hidden':''}" data-ref="${escapeHtml(q.ref)}">
      <div class="row1">
        <div class="row1-left">
          <label class="qcard-check" onclick="event.stopPropagation()">
            <input type="checkbox" class="sel-chk" data-ref="${escapeHtml(q.ref)}" ${selectedRefs.has(q.ref)?'checked':''}>
          </label>
          <span class="ref">${escapeHtml(q.ref)}</span>
        </div>
        <div class="row1-right">${viewBadgeHtml(q)}${pillHtml(q)}</div>
      </div>
      <div class="name">${escapeHtml(q.customerName)||'Unnamed customer'}</div>
      <div class="row3">
        <span class="total">${money(total)}</span>
        <div class="actions">
          <button class="hide-btn" data-ref="${escapeHtml(q.ref)}" data-hidden="${q.hidden?1:0}" title="${q.hidden ? 'Shows this quote in the list again.' : 'Hides from the list only. Still counted in dashboard figures.'}">${q.hidden?'Unhide':'Hide'}</button>
          <button class="del-btn" data-ref="${escapeHtml(q.ref)}" title="Delete permanently">Delete</button>
        </div>
      </div>
      ${staffHtml}${reasonHtml}
    </div>`;
  }).join('');
  Array.from(el.querySelectorAll('.qcard')).forEach(c=>{
    c.addEventListener('click', ()=> openQuote(c.dataset.ref));
  });
  Array.from(el.querySelectorAll('.sel-chk')).forEach(chk=>{
    chk.addEventListener('click', e=> e.stopPropagation());
    chk.addEventListener('change', e=>{
      const ref = chk.dataset.ref;
      if(chk.checked) selectedRefs.add(ref); else selectedRefs.delete(ref);
      renderList(false);
    });
  });
  Array.from(el.querySelectorAll('.hide-btn')).forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ref = btn.dataset.ref;
      const wasHidden = btn.dataset.hidden === '1';
      const q = await getQuote(ref);
      if(!q) return;
      q.hidden = !wasHidden;
      await saveQuote(q);
      if(draft && draft.ref===ref) draft.hidden = q.hidden;
      renderList();
    });
  });
  Array.from(el.querySelectorAll('.del-btn')).forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ref = btn.dataset.ref;
      if(!confirm(`Delete quote ${ref}? This can't be undone.`)) return;
      const ok = await deleteQuoteRow(ref);
      if(!ok){ alert('Could not delete — please try again.'); return; }
      selectedRefs.delete(ref);
      if(draft && draft.ref===ref){
        draft = null; currentRef = null; setDirty(false); dropDetailUrl();
        await route();
      } else {
        renderList();
      }
    });
  });
}

// Switching quotes (or starting a new one) would throw away edits that haven't been saved.
function confirmDiscard(){
  return !isDirty || confirm('You have unsaved changes to this quote. Discard them and continue?');
}

async function openEditor(ref){
  if(!confirmDiscard()) return;
  const loaded = await getQuote(ref);
  if(!loaded){ if(session || readStoredSession()) alert("Couldn't load that quote. Please try again."); return; }
  currentRef = ref;
  draft = loaded;
  if(!draft.shortSlug){ draft.shortSlug = genSlug(); await saveQuote(draft); }
  isDirty = false;
  renderEditor();
  renderList(false);
}

// Every piece of text that comes from the database (customer name, notes, line items, decline reason and
// category, refs, slugs, dates, status) goes through this before it is put into an HTML string. It escapes
// quotes too, so it is safe inside attribute values, and it copes with numbers / null.
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"'`]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
}
// Values that end up in a CSS class (never the raw database value).
const KNOWN_STATUSES = ['draft','sent','accepted','declined'];
const statusClass = s=> KNOWN_STATUSES.includes(s) ? s : 'draft';
const decisionClass = d=> d === 'accepted' ? 'accepted' : 'declined';
// New rows store reason_category; older rows may have reasonCategory.
const responseCategory = r=> (r && (r.reason_category || r.reasonCategory)) || '';
// Plain-text version of the same line (the card cuts it to one line and shows this as a tooltip)
function reasonPlain(r){
  if(!r) return '';
  const cat = responseCategory(r), reason = r.reason || '';
  return (cat || '') + (cat && reason ? ' · ' : '') + (reason ? `"${reason}"` : '');
}
// "Category · "reason"" as escaped HTML ('' when there is neither)
function reasonLine(r){
  if(!r) return '';
  const cat = responseCategory(r), reason = r.reason || '';
  if(!cat && !reason) return '';
  return (cat ? escapeHtml(cat) : '') + (cat && reason ? ' · ' : '') + (reason ? `"${escapeHtml(reason)}"` : '');
}

function lineTotal(li){
  const qty = parseFloat(li.qty), price = parseFloat(li.unitPrice)||0;
  return qty ? qty*price : price;
}
function liRowHtml(li, i){
  return `<tr class="li-row" data-i="${i}">
    <td><input class="li-product" aria-label="Description" placeholder="Product / SKU" value="${escapeHtml(li.product)}"></td>
    <td><input class="li-qty" aria-label="Qty" inputmode="decimal" placeholder="Qty" value="${escapeHtml(li.qty)}"></td>
    <td><input class="li-price" aria-label="Unit price" inputmode="decimal" placeholder="0.00" value="${escapeHtml(li.unitPrice)}"></td>
    <td class="li-total">${money(lineTotal(li))}</td>
    <td><button class="rm-btn" title="Remove" aria-label="Remove line item">×</button></td>
  </tr>`;
}
function renderLineItems(){
  document.getElementById('liRows').innerHTML = draft.lineItems.map(liRowHtml).join('');
  refreshTotalsOnly();
}
function addLineItem(){
  draft.lineItems.push({product:'',qty:'',unitPrice:''});

}

async function saveCurrent(){
  if(!draft || saving) return false;
  saving = true;
  const btn = document.getElementById('saveBtn');
  if(btn) btn.disabled = true;
  const v = editVersion;
  let ok = await saveQuote(draft);
  if(ok && draft.status === 'draft'){
    ok = await markSent(draft.ref);
    if(ok) draft.status = 'sent';
  }
  saving = false;
  const btnNow = document.getElementById('saveBtn');
  if(btnNow) btnNow.disabled = false;
  if(!ok){
    alert('Could not save — please try again.');
    return false;
  }
  // pick up a decision the customer may have made while this editor was open
  const fresh = await getQuote(draft.ref);
  if(fresh){ draft.status = fresh.status; draft.response = fresh.response; }
  if(v === editVersion) setDirty(false);
  const pill = document.querySelector('.editor-header .pill');
  if(pill){ const st = displayStatus(draft); pill.className = 'pill ' + st.cls; pill.textContent = st.label; pill.title = st.tip; }
  const flash = document.getElementById('savedFlash');
  if(flash){ flash.classList.add('show'); setTimeout(()=> flash.classList.remove('show'), 1600); }
  renderList();
  return true;
}

function refreshTotalsOnly(){
  const {subtotal, vat, total} = calcTotals(draft);
  const box = document.querySelector('.totals-box');
  if(box){
    box.innerHTML = `
      <div><span>Subtotal</span><span>${money(subtotal)}</span></div>
      <div><span>VAT (20%)</span><span>${money(vat)}</span></div>
      <div class="grand"><span>Total</span><span>${money(total)}</span></div>`;
  }
  document.querySelectorAll('#liRows .li-row').forEach((row,i)=>{
    row.querySelector('.li-total').textContent = money(lineTotal(draft.lineItems[i]));
  });
}

/* header band (bleeds to the page edges) */
.band{ background:var(--dark); color:#fff; padding:13mm 15mm 9mm; }
.band-top{ display:flex; justify-content:space-between; align-items:center; gap:10mm; }
h1{ margin:0; font-size:35pt; line-height:1.04; font-weight:700; text-transform:uppercase; letter-spacing:.01em; }
h1 span{ display:block; }
h1 .a{ color:var(--accent); } h1 .w{ color:#fff; }
.logo-panel{ flex:none; width:40mm; padding:2mm; background:#fff; border-radius:3mm; }
.logo{ display:block; width:100%; aspect-ratio:8/5; object-fit:cover; object-position:50% 46%; filter:invert(1) hue-rotate(180deg); }
.contact{ display:flex; flex-wrap:wrap; gap:2mm 8mm; margin-top:8mm; font-size:9pt; color:#ece8df; }
.contact span{ display:inline-flex; align-items:center; gap:2.2mm; }
.contact svg{ width:4.2mm; height:4.2mm; flex:none; fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* body — padding is cloned onto every page so pages 2+ keep their margins even with @page margin 0 */
.content{ padding:12mm 15mm 14mm; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
.meta{ display:flex; justify-content:space-between; align-items:flex-start; gap:10mm; margin-bottom:9mm; }
.label{ margin:0 0 1.5mm; font-size:8pt; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink); }
.who{ font-size:15pt; font-weight:600; line-height:1.25; overflow-wrap:anywhere; }
.facts{ text-align:right; font-size:10pt; line-height:1.7; }
.facts span{ color:var(--muted); } .facts b{ font-weight:600; }

table.items{ width:100%; border-collapse:collapse; }
.items thead{ display:table-header-group; }
.items tr{ break-inside:avoid; page-break-inside:avoid; }
.items th{ background:var(--dark); color:#fff; padding:3.4mm 4mm; text-align:left; font-size:8.5pt; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
.items td{ padding:4.2mm 4mm; border-bottom:.6pt solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
.items th.num, .items td.num{ text-align:right; white-space:nowrap; }
.items th:nth-child(2){ width:20mm; } .items th:nth-child(3), .items th:nth-child(4){ width:31mm; }

.closing{ margin-top:8mm; break-inside:avoid; page-break-inside:avoid; }
.totals{ width:78mm; margin-left:auto; }
.totals div{ display:flex; justify-content:space-between; padding:1.6mm 4mm; color:var(--muted); }
.totals .grand{ margin-top:2mm; padding-top:3.6mm; border-top:1.2pt solid var(--ink); font-size:16pt; font-weight:700; line-height:1.2; color:var(--accent); }
.terms{ margin-top:9mm; }
.terms p{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.accept{ margin-top:8mm; padding:5mm 6mm; background:var(--tint); border:.6pt solid #e6dcc8; border-left:1.6mm solid var(--accent); border-radius:2mm; }
.accept h3{ margin:0 0 1.5mm; font-size:11.5pt; font-weight:600; }
.accept p{ margin:0; }
.accept a{ color:var(--ink); font-weight:600; text-decoration:none; overflow-wrap:anywhere; }
.signoff{ margin-top:10mm; font-size:10pt; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }

@media print{ .page{ width:auto; } }
@media screen{ body{ background:#e6e4df; } .page{ margin:8mm auto; box-shadow:0 2px 16px rgba(0,0,0,.25); min-height:297mm; } }
</style></head>
<body><div class="page">
<div class="band">
  <div class="band-top">
    <h1><span class="a">Your flooring</span><span class="w">Quote</span></h1>
    <div class="logo-panel"><img class="logo" src="${logo}" alt="${escapeHtml(biz)}"></div>
  </div>
  ${contact ? `<div class="contact">${contact}</div>` : ''}
</div>
<div class="content">
  <div class="meta">
    <div><div class="label">Prepared for</div><div class="who">${escapeHtml(name) || '—'}</div></div>
    <div class="facts">
      <div><span>Quote no:</span> <b>${escapeHtml(q.ref)}</b></div>
      <div><span>Date:</span> <b>${escapeHtml(fmtDate(q.date))}</b></div>
      <div><span>Valid until:</span> <b>${escapeHtml(fmtDate(q.validUntil))}</b></div>
    </div>
  </div>
  <table class="items"><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="closing">
    <div class="totals"><div><span>Subtotal</span><span>${money(subtotal)}</span></div><div><span>VAT (20%)</span><span>${money(vat)}</span></div><div class="grand"><span>Total</span><span>${money(total)}</span></div></div>
    ${notes ? `<div class="terms"><div class="label">Terms</div><p>${escapeHtml(notes)}</p></div>` : ''}
    <div class="accept"><h3>Ready to go ahead?</h3><p>You can accept or decline online at <a href="${escapeHtml(link)}">${escapeHtml(linkText)}</a>. Or just reply to the message we sent you.</p></div>
    <div class="signoff">Thank you for choosing ${escapeHtml(biz)}</div>
  </div>
</div>
</div>
<script>
window.addEventListener('load', function(){
  var go = function(){ setTimeout(function(){ window.focus(); window.print(); }, 150); };
  var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  var cap = new Promise(function(r){ setTimeout(r, 3000); });   // don't hang if the web fonts can't load
  Promise.race([fonts, cap]).then(go);
});
<\/script>
</body></html>`;
}
function printQuote(){
  if(!draft) return;
  const w = window.open('', '_blank');   // opened synchronously from the click so pop-up blockers allow it
  if(!w){ alert('Your browser blocked the print window — allow pop-ups for this site and try again.'); return; }
  w.document.open();
  w.document.write(buildPrintHtml(draft));
  w.document.close();
}

/* ---------------- admin views: Dashboard / Quotes / Reminders / Settings ---------------- */
// #/quotes, #/quotes/DCF-1234 (a quote open), #/quotes?status=declined, #/reminders, #/reminders/DCF-1234, #/dashboard, #/settings
const VIEW_RE = /^#\/(dashboard|quotes|reminders|settings)(?:\/([^/?#]+))?\/?(?:\?(.*))?$/;
const mobileMq = window.matchMedia('(max-width:800px)');
const isMobile = ()=> mobileMq.matches;
const scrollMemo = new Map();          // list / dashboard scroll position, restored when Back returns to it
let adminView = null;
let navSeq = 0;
let firstRenderDone = false;
let dashPeriod = DEFAULT_PERIOD;
let adminReturnUrl = '/#/quotes';      // where "Admin ↗" returns to after previewing a quote

function viewFromHash(){ const m = location.hash.match(VIEW_RE); return m ? m[1] : null; }
// the Quotes status chip lives in the hash (#/quotes?status=declined) so refresh and Back keep it
function refFromHash(){
  const m = location.hash.match(VIEW_RE);
  if(!m || !m[2] || (m[1] !== 'quotes' && m[1] !== 'reminders')) return null;
  try{ return decodeURIComponent(m[2]); }catch(e){ return null; }
}
function statusFromHash(){
  const m = location.hash.match(VIEW_RE);
  if(!m || m[1] !== 'quotes' || !m[3]) return 'all';
  const st = new URLSearchParams(m[3]).get('status');
  return STATUS_FILTERS.some(([k])=> k === st) ? st : 'all';
}
function viewHash(view, ref){
  return '#/' + view + (ref ? '/' + encodeURIComponent(ref) : '') + (view === 'quotes' && statusFilter !== 'all' ? '?status=' + statusFilter : '');
}

// count badge on the sidebar's Reminders item
function refreshBadge(all){
  const list = reminderQuotes(all);
  const badge = document.getElementById('reminderBadge');
  badge.textContent = list.length;
  badge.classList.toggle('zero', list.length === 0);
  return list;
}
// the list panel is shared by Quotes and Reminders; Reminders has no date/hidden filters or bulk select
function syncListUi(){
  const isRem = listTab === 'reminders';
  document.getElementById('remHead').style.display = isRem ? '' : 'none';
  document.getElementById('remHelp').textContent = `Sent quotes that have waited more than ${settings.reminderDays} days with no answer. Quotes you've chased or snoozed stay out of the way until the snooze ends.`;
  document.getElementById('listFilters').style.display = isRem ? 'none' : '';
  document.getElementById('selectAllRow').style.display = isRem ? 'none' : '';
  document.getElementById('statusChips').style.display = isRem ? 'none' : '';
  if(isRem) document.getElementById('bulkBar').style.display = 'none';
}
function setViewUi(view, ref){
  adminView = view;
  listTab = view === 'reminders' ? 'reminders' : 'all';
  if(view !== 'quotes') statusFilter = 'all';
  document.getElementById('admin').dataset.view = view;
  document.getElementById('admin').dataset.screen = ref ? 'detail' : 'list';      // on a phone: one quote full screen, or the list
  document.querySelectorAll('.nav-item').forEach(a=>{
    const on = a.dataset.view === view;
    a.classList.toggle('active', on);
    if(on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  syncListUi();
}
function pushViewUrl(view){
  if(location.pathname !== '/' || location.hash !== viewHash(view)) history.pushState(null, '', '/' + viewHash(view));
}
async function goView(view){ pushViewUrl(view); await enterView(view); }

async function enterView(view, ref){
  const seq = ++navSeq;
  setViewUi(view, ref);
  const back = ref ? undefined : scrollMemo.get(viewHash(view));      // coming Back to a list / the dashboard: same scroll position
  const memoKey = viewHash(view);
  if(back !== undefined) setTimeout(()=> scrollMemo.delete(memoKey), 1500);   // (popstate + hashchange can route twice)
  if(back === undefined) window.scrollTo(0, 0);
  const restore = ()=>{ if(back !== undefined) requestAnimationFrame(()=> window.scrollTo(0, back)); };
  if(view === 'dashboard'){
    const all = await loadQuotes(true);
    if(seq !== navSeq) return;
    refreshBadge(all); renderDashboard(all); restore();
    return;
  }
  if(view === 'settings'){
    renderSettings();
    const all = await loadQuotes(false);
    if(seq === navSeq) refreshBadge(all);
    return;
  }
  await renderList();                                   // Quotes / Reminders: list + editor
  if(seq !== navSeq) return;
  if(ref){ await showQuote(ref, seq); return; }
  restore();
  if(isMobile()) return;                                // phones: the list is a screen of its own, nothing opens by itself
  if(draft){ renderEditor(); renderList(false); return; }
  const all = await loadQuotes(false);
  const first = (view === 'reminders' ? reminderQuotes(all) : visibleQuotes(all))[0];
  if(first) openEditor(first.ref);
  else document.getElementById('editorPane').innerHTML = `<div class="empty-list" style="padding-top:60px;">${all.length ? 'Select a quote from the list.' : 'Create your first quote to get started.'}</div>`;
}
// the quote named in the URL (a full screen of its own on a phone)
async function showQuote(ref, seq){
  if(!draft || draft.ref !== ref){
    if(draft && isDirty && !confirmDiscard()){          // the URL moved on, but there are unsaved edits: stay on that quote
      history.replaceState(null, '', '/' + viewHash(adminView, draft.ref)); setViewUi(adminView, draft.ref); return;
    }
    const loaded = await getQuote(ref);
    if(seq !== navSeq) return;
    if(!loaded){
      showToast("That quote isn't there any more.");
      history.replaceState(null, '', '/' + viewHash(adminView)); setViewUi(adminView, null);
      document.getElementById('editorPane').innerHTML = '<div class="empty-list" style="padding-top:60px;">Select a quote from the list.</div>';
      return;
    }
    draft = loaded; currentRef = ref; isDirty = false;
    if(!draft.shortSlug){ draft.shortSlug = genSlug(); await saveQuote(draft); }
    renderEditor();
  }else{
    // the same quote again (coming Back to it): pick up anything that changed meanwhile, keeping unsaved edits
    const fresh = await getQuote(ref);
    if(seq !== navSeq) return;
    if(fresh && draft && draft.ref === ref){
      ['status','response','viewCount','firstViewedAt','lastViewedAt','lastChasedAt','snoozedUntil'].forEach(k=>{ draft[k] = fresh[k]; });
      if(!isDirty) draft.validUntil = fresh.validUntil;
    }
    renderEditor();
  }
  renderList(false);
}
// Opening a quote from a list. On a phone it is a new screen (its own history entry, so Back returns to the same list);
// on a desktop the editor just swaps in beside the list.
async function openQuote(ref){
  const same = !!draft && draft.ref === ref;
  const view = adminView === 'reminders' ? 'reminders' : 'quotes';
  if(!isMobile() && adminView === view){
    await openEditor(ref);
    if(draft && draft.ref === ref) history.replaceState(null, '', '/' + viewHash(view, ref));
    return;
  }
  if(!same && !confirmDiscard()) return;
  if(!same) isDirty = false;
  scrollMemo.set(viewHash(adminView), window.scrollY);
  history.pushState({ dcfDetail:true }, '', '/' + viewHash(view, ref));
  await enterView(view, ref);
}
function backToList(){
  if(history.state && history.state.dcfDetail){ history.back(); return; }
  const view = adminView === 'reminders' ? 'reminders' : 'quotes';
  history.replaceState(null, '', '/' + viewHash(view));
  enterView(view);
}
// the open quote was deleted: drop it from the URL so nothing tries to show it again
function dropDetailUrl(){
  if(refFromHash()) history.replaceState(null, '', '/' + viewHash(adminView === 'reminders' ? 'reminders' : 'quotes'));
}
// settings are loaded once per session, and never hold the app up
function startSettingsLoad(){
  settingsPromise = loadSettings().then(()=>{ if(firstRenderDone) refreshCurrentView(); });
}
async function refreshCurrentView(){
  const all = await loadQuotes(false);
  refreshBadge(all);
  if(adminView === 'dashboard') renderDashboard(all);
  else if(adminView === 'settings') renderSettings();
  else if(adminView === 'quotes' || adminView === 'reminders') renderList(false);
}

/* ----- Dashboard ----- */
const PERIODS = [['month','This month'], ['30d','Last 30 days'], ['quarter','This quarter'], ['all','All time']];
const gbp0 = n => '£' + Math.round(n || 0).toLocaleString('en-GB');          // £12,345, no pence
const quoteValue = q => calcTotals(q).total;                                  // VAT-inclusive
const sumValue = list => list.reduce((s, q)=> s + quoteValue(q), 0);
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
function createdMs(q){ const t = Date.parse(q.createdAt || q.date || ''); return isNaN(t) ? null : t; }
function periodStart(p){
  const n = new Date();
  if(p === 'month') return new Date(n.getFullYear(), n.getMonth(), 1).getTime();
  if(p === '30d') return Date.now() - 30 * DAY_MS;
  if(p === 'quarter') return new Date(n.getFullYear(), Math.floor(n.getMonth() / 3) * 3, 1).getTime();
  return -Infinity;
}
const inPeriod = (q, p)=>{ const t = createdMs(q); return t === null ? p === 'all' : t >= periodStart(p); };
const SENT_STATUSES = ['sent','accepted','declined'];            // everything that has gone to a customer (not drafts)

function dashboardStats(all, period){
  const qs = all.filter(q=> inPeriod(q, period));                  // hidden quotes still count: hiding only tidies the Quotes list
  const nonDraft = qs.filter(q=> SENT_STATUSES.includes(q.status));
  const open = qs.filter(q=> q.status === 'sent' && !isQuoteExpired(q));
  const won = qs.filter(q=> q.status === 'accepted');
  const lost = qs.filter(q=> q.status === 'declined');
  const decided = [...won, ...lost].map(q=>{
    const a = createdMs(q), b = Date.parse(q.response && q.response.respondedAt || '');
    return (a === null || isNaN(b)) ? null : Math.max(0, (b - a) / DAY_MS);
  }).filter(x=> x !== null);
  const nonDraftValue = sumValue(nonDraft), wonValue = sumValue(won);
  return {
    open, openValue: sumValue(open), won, wonValue, lost, lostValue: sumValue(lost), nonDraft,
    winRate: nonDraft.length ? won.length / nonDraft.length : null,
    winRateValue: nonDraftValue > 0 ? wonValue / nonDraftValue : null,
    avgValue: nonDraft.length ? nonDraftValue / nonDraft.length : null,
    avgDays: decided.length ? decided.reduce((s, x)=> s + x, 0) / decided.length : null, decidedCount: decided.length
  };
}
function attentionLists(all){
  const sent = all.filter(q=> !q.hidden && q.status === 'sent' && !isQuoteExpired(q));
  const today = todayLondon(), soon = addDays(today, EXPIRING_SOON_DAYS);
  const age = q=> quoteAgeDays(q) || 0;
  const lists = {
    expiring: sent.filter(q=> q.validUntil && q.validUntil >= today && q.validUntil <= soon).sort((a, b)=> a.validUntil < b.validUntil ? -1 : a.validUntil > b.validUntil ? 1 : 0),
    warm: sent.filter(q=> (q.viewCount || 0) >= WARM_MIN_VIEWS).sort((a, b)=> (b.viewCount || 0) - (a.viewCount || 0) || Date.parse(b.lastViewedAt || 0) - Date.parse(a.lastViewedAt || 0)),
    cold: sent.filter(q=> !(q.viewCount || 0) && age(q) > NEVER_OPENED_AFTER_DAYS).sort((a, b)=> age(b) - age(a))
  };
  // quotes that would be listed but are snoozed are held back (counted once, even if they're in two lists)
  const held = new Map();
  Object.keys(lists).forEach(k=>{
    lists[k].filter(isSnoozed).forEach(q=> held.set(q.ref, q));
    lists[k] = lists[k].filter(q=> !isSnoozed(q));
  });
  lists.snoozed = Array.from(held.values()).sort(bySnoozeEnd);
  return lists;
}
// quotes sent (by the week they were created) vs accepted (by the week the customer accepted) for the last CHART_WEEKS weeks
function weeklySeries(all){
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  const weeks = [];
  for(let i = CHART_WEEKS - 1; i >= 0; i--){
    const start = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() - 7 * i);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7);
    weeks.push({ start: start.getTime(), end: end.getTime(), label: start.toLocaleDateString('en-GB', { day:'numeric', month:'short' }), sent: 0, won: 0 });
  }
  const where = t=> weeks.find(w=> t >= w.start && t < w.end);
  all.forEach(q=>{
    if(SENT_STATUSES.includes(q.status)){ const t = createdMs(q); const w = t === null ? null : where(t); if(w) w.sent++; }
    if(q.status === 'accepted'){ const t = Date.parse((q.response && q.response.respondedAt) || q.updatedAt || ''); const w = isNaN(t) ? null : where(t); if(w) w.won++; }
  });
  return weeks;
}
function sentAgo(q){
  const d = Math.floor(quoteAgeDays(q) || 0);
  return d < 1 ? 'Sent today' : `Sent ${plural(d, 'day')} ago`;
}
function naRow(q, extra, withExtend){
  const chased = chasedLabel(q);
  return `<div class="na-row" data-ref="${escapeHtml(q.ref)}">
    <div class="na-top"><span class="na-name">${escapeHtml(q.customerName) || 'Unnamed customer'}</span><span class="na-value">${gbp0(quoteValue(q))}</span></div>
    <div class="na-meta">${escapeHtml(q.ref)} · ${escapeHtml(sentAgo(q))}${extra ? '<br>' + escapeHtml(extra) : ''}${chased ? '<br>' + escapeHtml(chased) : ''}</div>
    <button class="copy-fu-btn" type="button" data-ref="${escapeHtml(q.ref)}">Copy follow-up message</button>
    ${cardActionsHtml(q, withExtend)}
  </div>`;
}
function attentionCol(title, list, empty, extraFn, withExtend){
  const shown = list.slice(0, NEEDS_ATTENTION_MAX);
  return `<div class="att-col">
    <h3>${escapeHtml(title)} <span>${list.length}</span></h3>
    ${shown.length ? shown.map(q=> naRow(q, extraFn(q), withExtend)).join('') : `<div class="na-empty">${escapeHtml(empty)}</div>`}
    ${list.length > shown.length ? `<div class="na-more">+ ${list.length - shown.length} more</div>` : ''}
  </div>`;
}
function kpiCard(label, value, sub, cap, dim){
  return `<div class="kpi"><div class="k-label">${escapeHtml(label)}</div><div class="k-value${dim ? ' dim' : ''}">${escapeHtml(value)}</div><div class="k-sub">${sub}</div><div class="k-cap">${escapeHtml(cap)}</div></div>`;
}
function renderDashboard(all){
  const el = document.getElementById('dashboardPane');
  const st = dashboardStats(all, dashPeriod), att = attentionLists(all), today = todayLondon();
  const mobile = isMobile(), collapsed = mobile && naCollapsed;
  const naTotal = new Set([...att.expiring, ...att.warm, ...att.cold].map(q=> q.ref)).size;   // each quote counted once
  const pct = x=> Math.round(x * 100) + '%';
  const expText = q=>{
    const d = (Date.parse(q.validUntil + 'T00:00:00Z') - Date.parse(today + 'T00:00:00Z')) / DAY_MS;
    return d < 1 ? 'Expires today' : d < 2 ? 'Expires tomorrow' : `Expires in ${d} days`;
  };
  const kpis = [
    kpiCard('Potential revenue', gbp0(st.openValue), escapeHtml(st.open.length ? plural(st.open.length, 'open quote') : 'No open quotes'),
      'Quotes sent and still waiting for an answer (not expired), created in this period.', !st.open.length),
    kpiCard('Won', gbp0(st.wonValue), escapeHtml(st.won.length ? plural(st.won.length, 'accepted quote') : 'No accepted quotes yet'),
      'Accepted quotes created in this period.', !st.won.length),
    kpiCard('Win rate', st.winRate === null ? '—' : pct(st.winRate),
      st.winRate === null ? 'No quotes sent in this period'
        : `${escapeHtml(`${st.won.length} of ${plural(st.nonDraft.length, 'quote')}`)}<small>${escapeHtml(st.winRateValue === null ? '' : `By value: ${pct(st.winRateValue)}`)}</small>`,
      'Accepted ÷ all non-draft quotes created in this period.', st.winRate === null),
    kpiCard('Average quote value', st.avgValue === null ? '—' : gbp0(st.avgValue),
      escapeHtml(st.avgValue === null ? 'No quotes sent in this period' : `Across ${plural(st.nonDraft.length, 'quote')}`),
      'Average total (inc. VAT) of non-draft quotes created in this period.', st.avgValue === null),
    kpiCard('Average time to decision', st.avgDays === null ? '—' : (st.avgDays < 1 ? 'Under a day' : `${st.avgDays.toFixed(1)} days`),
      escapeHtml(st.avgDays === null ? 'No decisions yet' : `From ${plural(st.decidedCount, 'decided quote')}`),
      'Average time from creating a quote to the customer accepting or declining it.', st.avgDays === null),
    kpiCard('Lost', gbp0(st.lostValue), escapeHtml(st.lost.length ? plural(st.lost.length, 'declined quote') : 'No declined quotes'),
      'Declined quotes created in this period.', !st.lost.length)
  ].join('');
  const weeks = weeklySeries(all), maxCount = Math.max(1, ...weeks.map(w=> Math.max(w.sent, w.won)));
  const chartHas = weeks.some(w=> w.sent || w.won);
  const bar = (n, cls, what, w)=> n ? `<div class="bar ${cls}" style="height:${Math.max(3, n / maxCount * 100)}%" title="${escapeHtml(`${what}: ${n} (week of ${w.label})`)}"><i>${n}</i></div>` : '';
  const chart = chartHas
    ? `<div class="chart" role="img" aria-label="${escapeHtml('Quotes sent and accepted per week: ' + weeks.map(w=> `week of ${w.label}, ${w.sent} sent, ${w.won} accepted`).join('; '))}">${
        weeks.map(w=> `<div class="wk"><div class="bars">${bar(w.sent, 'sent', 'Sent', w)}${bar(w.won, 'won', 'Accepted', w)}</div><div class="wk-label">${escapeHtml(w.label)}</div></div>`).join('')
      }</div><div class="legend"><span class="l-sent">Sent</span><span class="l-won">Accepted</span></div>`
    : `<div class="na-empty">No quotes have been sent in the last ${CHART_WEEKS} weeks yet. Once you send some, they'll show up here.</div>`;

async function onSettingsSubmit(e){
  e.preventDefault();
  const msg = document.getElementById('settingsMsg'), btn = document.getElementById('settingsSave');
  const val = id=> document.getElementById(id).value;
  const fail = (text, id)=>{ msg.className = 'settings-msg err'; msg.textContent = text; if(id) document.getElementById(id).focus(); };
  const whole = (id, lo, hi)=>{ const v = Number(val(id)); return val(id).trim() !== '' && Number.isInteger(v) && v >= lo && v <= hi ? v : null; };
  const validDays = whole('s-valid', 1, 365), remindDays = whole('s-remind', 1, 90);
  const email = val('s-email').trim();
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('That email address doesn\'t look right.', 's-email');
  if(validDays === null) return fail('Default quote validity must be a whole number of days from 1 to 365.', 's-valid');
  if(remindDays === null) return fail('Reminder days must be a whole number from 1 to 90.', 's-remind');
  const next = { businessName: val('s-name').trim(), phone: val('s-phone').trim(), email, address: val('s-address').trim(),
                 defaultTerms: val('s-terms'), quoteValidDays: validDays, reminderDays: remindDays };
  btn.disabled = true; msg.className = 'settings-msg'; msg.textContent = 'Saving…';
  const ok = await saveSettings(next);
  btn.disabled = false;
  if(!ok) return fail("Couldn't save your settings. Please try again.");
  settings = next; settingsState = 'ok'; applySettings();
  msg.className = 'settings-msg'; msg.textContent = 'Saved';
  refreshBadge(await loadQuotes(false));          // the reminder days may have changed
}

// "Today" in the UK, as YYYY-MM-DD: a quote is valid up to and including its valid-until date.
function todayLondon(){
  return new Intl.DateTimeFormat('en-CA', { timeZone:'Europe/London', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
}
function isExpired(q){ return !!q.validUntil && q.validUntil < todayLondon(); }
function fmtDate(s){ if(!s) return '—'; const d = new Date(s+'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); }

async function submitDecision(q, decision, reason){
  const busy = on=>{
    ['acceptBtn','declineBtn'].forEach(id=>{ const b = document.getElementById(id); if(b) b.disabled = on; });
    document.querySelectorAll('#declineForm .btn').forEach(b=> b.disabled = on);
  };
  const fail = text=>{ const e = document.getElementById('decisionError'); if(e) e.textContent = text; };
  fail(''); busy(true);
  let recorded = false;
  try{
    recorded = await rpc('submit_decision', { p_slug: q.shortSlug, p_decision: decision, p_reason: reason || null, p_reason_category: null });
  }catch(e){
    busy(false);
    fail("Sorry, we couldn't send that. Please check your connection and try again.");
    return;
  }
  // show what is actually stored: this also covers a quote that was already decided
  let fresh = null;
  try{ fresh = await getQuoteBySlug(q.shortSlug); }catch(e){}
  if(fresh){ q.status = fresh.status; q.response = fresh.response; q.validUntil = fresh.validUntil; }
  else if(recorded){ q.status = decision; q.response = { decision, reason, respondedAt: new Date().toISOString() }; }
  const decided = !!q.response && (q.status === 'accepted' || q.status === 'declined');
  if(!decided){   // nothing was recorded and the quote is still unanswered
    if(q.status === 'sent' && isExpired(q)){
      fail('This quote has expired, please contact us');   // buttons stay disabled: it can't be answered any more
    }else{
      busy(false);
      fail("Sorry, we couldn't record your response. Please try again, or contact us if it keeps happening.");
    }
    return;
  }
  renderDecisionPage(q);
  if(!recorded && q.response && q.response.decision !== decision){
    const el = document.querySelector('#decisionPage .decided-state') || document.querySelector('.decided-state');
    if(el){ const n = document.createElement('div'); n.className = 'decided-note'; n.textContent = `This quote had already been ${q.response.decision}, so your response wasn't changed.`; el.appendChild(n); }
  }
}

function wireBook(){
  const bookEl = document.getElementById('book');
  const pages = Array.from(bookEl.querySelectorAll('.page'));
  const total = pages.length;
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = pages.map((_,i)=>`<div class="dot" data-i="${i}"></div>`).join('');
  const dots = Array.from(dotsEl.children);
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  const PageFlipCtor = (window.St && window.St.PageFlip) || window.PageFlip;
  const pageFlip = new PageFlipCtor(bookEl, {
    width: 480,
    height: 672,
    size: 'stretch',
    minWidth: 260,
    maxWidth: 700,
    minHeight: 364,
    maxHeight: 980,
    maxShadowOpacity: 0.5,
    showCover: false,
    usePortrait: true,
    mobileScrollSupport: false
  });
  pageFlip.loadFromHTML(pages);

  function updateControls(){
    const idx = pageFlip.getCurrentPageIndex();
    dots.forEach((d,i)=> d.classList.toggle('active', i===idx));
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total-1;
  }
  pageFlip.on('flip', updateControls);
  updateControls();

  nextBtn.addEventListener('click', ()=> pageFlip.flipNext());
  prevBtn.addEventListener('click', ()=> pageFlip.flipPrev());
  dots.forEach(d=> d.addEventListener('click', ()=> pageFlip.flip(parseInt(d.dataset.i,10))));
}

/* ---------------- routing ---------------- */
function isPreview(){
  // "Preview as customer" opens the quote with ?preview=1 so admin views are never counted
  return new URLSearchParams(location.search).get('preview') === '1';
}
function siteBase(){
  // Site is served from a custom domain root (quotes.benchcreative.co.uk).
  return location.origin;
}
// The only public URL is a customer link: /q/<slug>. Everything else is the admin area and needs a login.
function routeMatch(){
  const m = location.pathname.match(/^\/q\/([^\/?#]+)\/?$/i);
  if(!m) return null;
  let value = m[1];
  try{ value = decodeURIComponent(value); }catch(e){}
  return { type:'slug', value };
}
function showLogin(){
  const login = document.getElementById('login');
  login.style.display = 'flex';
  document.getElementById('loginError').textContent = signedOutNotice;
  signedOutNotice = '';
  document.getElementById('loginPassword').value = '';
  const email = document.getElementById('loginEmail');
  if(document.activeElement !== document.getElementById('loginPassword')) email.focus();
}
async function route(){
  const adminEl = document.getElementById('admin');
  const customerEl = document.getElementById('customer');
  const loginEl = document.getElementById('login');
  const adminLink = document.getElementById('adminLink');
  const match = routeMatch();

  if(match){
    adminEl.style.display = 'none'; loginEl.style.display = 'none';
    customerEl.style.display = 'flex';
    adminLink.style.display = (isPreview() || session || readStoredSession()) ? 'block' : 'none';
    await renderCustomer(match);
    return;
  }

  // admin area: nothing at all is shown until there is a valid session
  customerEl.style.display = 'none'; adminLink.style.display = 'none';
  const token = await getAccessToken();
  if(!token){
    adminEl.style.display = 'none';
    if(token === undefined && !signedOutNotice) signedOutNotice = "Couldn't reach the server. Check your connection and try again.";
    showLogin();
    return;
  }
  loginEl.style.display = 'none';
  adminEl.style.display = 'flex';
  // the business settings load once per session and never hold the app up: after a short wait it uses the defaults
  if(settingsState === 'idle') startSettingsLoad();
  await Promise.race([settingsPromise, new Promise(r=> setTimeout(r, SETTINGS_WAIT_MS))]);
  const view = viewFromHash() || 'dashboard';          // Dashboard is the landing view
  statusFilter = view === 'quotes' ? statusFromHash() : 'all';
  const ref = refFromHash();
  if(location.pathname + location.hash !== '/' + viewHash(view, ref)) history.replaceState(history.state, '', '/' + viewHash(view, ref));
  await enterView(view, ref);
  firstRenderDone = true;
}

  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  if(!email || !password){ err.textContent = 'Enter your email and password.'; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  const r = await signIn(email, password);
  btn.disabled = false; btn.textContent = 'Sign in';
  const pw = document.getElementById('loginPassword');
  if(!r.ok){ err.textContent = r.message; pw.value = ''; pw.focus(); return; }
  pw.value = '';
  route();
});
document.getElementById('logoutBtn').addEventListener('click', signOut);
document.getElementById('adminLink').addEventListener('click', e=>{
  e.preventDefault();
  history.pushState(null, '', adminReturnUrl || '/#/quotes');
  route();
});
// back/forward and the sidebar links change the URL; the two events can both fire, so collapse them into one route()
let routeTimer = null;
function scheduleRoute(){ clearTimeout(routeTimer); routeTimer = setTimeout(route, 15); }
window.addEventListener('popstate', scheduleRoute);
window.addEventListener('hashchange', scheduleRoute);
// signing in or out in another tab
window.addEventListener('storage', e=>{
  if(e.key !== SESSION_KEY || routeMatch()) return;   // customer pages don't care
  session = readStoredSession();
  if(!session) resetAdminState();
  route();
});
route();

// StPageFlip's loadFromHTML() clones the page content into its own managed DOM structure
// for the flip animation, and clones don't carry over JS event listeners — so a listener
// attached directly to the decline-reason textarea when it's first rendered (before
// wireBook() runs and clones it) never survives onto the copy that actually ends up on
// screen. StPageFlip also attaches its own (non-capturing) mousedown/touchstart handler on
// an ancestor of the page content to detect swipe drags, and calls preventDefault() on it,
// which blocks the browser's native focus-on-click for any form element underneath — so
// the textarea silently never receives focus and typed keystrokes go nowhere. Fixed with a
// single capturing-phase listener on `document`: capture always runs before an ancestor's
// bubble-phase listener gets a chance, and delegation via `document` doesn't depend on the
// specific (possibly-cloned) textarea node, so it works regardless of when/how the flipbook
// rebuilds the page DOM.
['mousedown','touchstart'].forEach(evt=>{
  document.addEventListener(evt, e=>{
    if(e.target && e.target.id === 'declineReason') e.stopPropagation();
  }, true);
});
</script>
