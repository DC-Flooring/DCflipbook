<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DC Flooring — Quotes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@500;600&display=swap');
/* "Garet" isn't available on Google Fonts or Fontshare (checked both — it's a commercial font,
   not freely CDN-hosted). Using Poppins as a clean geometric-sans fallback for the dark pages'
   headings; swap the font-family below for the real thing if a licensed copy becomes available. */

:root{
  --bark:#241a14; --walnut:#3c2c22; --oak:#a97e4f; --brass:#b08d57;
  --linen:#f3ede1; --linen-soft:rgba(243,237,225,.62); --paper:#faf6ee; --ink:#2a2019; --ink-soft:#6b5c4d; --line:#d9cbb2;
  --ok:#4c6b4f; --bad:#a1493f;
}
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; background:var(--linen); font-family:'Work Sans',sans-serif; color:var(--ink); }
button{ font-family:inherit; }
::selection{ background:var(--brass); color:#fff; }

/* ===== shared bits ===== */
.eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--oak); margin:0 0 6px; }
.mono{ font-family:'IBM Plex Mono',monospace; }
h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0; }
.pill{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:20px; }
.pill.draft{ background:#e5dbc7; color:var(--ink-soft); }
.pill.sent{ background:#e0d3ba; color:var(--walnut); }
.pill.accepted{ background:#dbe6dc; color:var(--ok); }
.pill.declined{ background:#f0dcd9; color:var(--bad); }

/* ===== LOGIN ===== */
#login{ display:none; min-height:100vh; align-items:center; justify-content:center; padding:24px 16px; background:#272727; color:var(--linen); }
.login-card{ width:100%; max-width:360px; display:flex; flex-direction:column; gap:6px; }
.login-logo{ display:block; width:150px; align-self:center; aspect-ratio:8/5; object-fit:cover; object-position:50% 46%; mix-blend-mode:lighten; }
.login-title{ margin:2px 0 20px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); }
.login-card label{ margin-top:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--linen-soft); }
.login-card input{ width:100%; padding:11px 12px; border:1px solid #4a4a4a; border-radius:4px; background:#1d1d1d; color:var(--linen); font-family:'Work Sans',sans-serif; font-size:16px; }
.login-card input:focus{ outline:none; border-color:var(--brass); }
.login-error{ min-height:20px; margin:10px 0 6px; font-size:13px; line-height:1.4; color:#e8a398; }
.login-card .btn{ width:100%; padding:12px; }

/* ===== ADMIN ===== */
#admin{ display:none; min-height:100vh; }
.admin-body{ display:flex; max-width:1560px; margin:0 auto; gap:0; min-height:100vh; }
.sidebar{
  width:200px; flex-shrink:0; background:#272727; color:var(--linen); padding:28px 20px;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;
}
.sidebar .sidebar-logo{ display:block; width:100%; max-width:160px; height:auto; aspect-ratio:8/5; object-fit:cover; object-position:50% 46%; mix-blend-mode:lighten; }
.sidebar-meta{ display:flex; flex-direction:column; align-items:center; gap:10px; }
.logout-link{ padding:0; background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--linen-soft); text-decoration:underline; cursor:pointer; }
.logout-link:hover{ color:var(--brass); }
.sidebar .tagline{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); }
.list-pane{ width:300px; flex-shrink:0; border-right:1px solid var(--line); padding:20px; background:var(--paper); }
.new-btn{
  width:100%; padding:11px; background:var(--brass); color:#fff; border:none; border-radius:4px;
  font-size:13px; font-weight:600; letter-spacing:.02em; cursor:pointer; margin-bottom:16px;
}
.new-btn:hover{ background:var(--oak); }
.list-tabs{ display:flex; gap:4px; margin:-4px 0 14px; border-bottom:1px solid var(--line); }
.list-tab{
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:none; border:none;
  border-bottom:2px solid transparent; margin-bottom:-1px; padding:8px 4px 9px; font-size:12.5px; font-weight:600;
  color:var(--ink-soft); cursor:pointer;
}
.list-tab:hover{ color:var(--ink); }
.list-tab.active{ color:var(--ink); border-bottom-color:var(--brass); }
.tab-badge{ min-width:18px; padding:1px 6px; border-radius:10px; background:var(--brass); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:10.5px; line-height:1.4; }
.tab-badge.zero{ background:#e5dbc7; color:var(--ink-soft); }
.list-search{
  width:100%; padding:8px 10px; margin-bottom:12px; border:1px solid var(--line); border-radius:4px;
  font-size:13px; font-family:'Work Sans',sans-serif; background:#fff; color:var(--ink);
}
.list-search:focus{ outline:none; border-color:var(--brass); }
.qcard{
  border:1px solid var(--line); border-radius:5px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
  background:#fff; transition:border-color 150ms;
}
.qcard:hover{ border-color:var(--brass); }
.qcard.active{ border-color:var(--brass); box-shadow:0 0 0 1px var(--brass); }
.qcard{ min-width:0; }
.qcard .row1{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px 8px; margin-bottom:5px; }
.qcard .row1-left{ display:flex; gap:6px; align-items:center; min-width:0; }
.qcard .row3{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px 8px; margin-top:4px; }
.qcard .actions{ display:flex; gap:6px; flex-wrap:wrap; }
.qcard .waiting{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.04em; color:var(--bad); }
.qcard .views{ margin-top:6px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); }
.qcard .views.opened{ color:var(--ok); }
.list-section{ display:flex; justify-content:space-between; margin:16px 2px 8px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }
.list-section:first-child{ margin-top:2px; }
.copy-fu-btn{
  width:100%; margin-top:8px; padding:7px 10px; background:none; border:1px solid var(--brass); color:var(--brass);
  border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;
}
.copy-fu-btn:hover{ background:var(--brass); color:#fff; }
.qcard .ref{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
.qcard .name{ font-size:14px; font-weight:600; margin-bottom:2px; overflow-wrap:anywhere; }
.qcard .total{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }
.qcard .reason{ font-size:11px; color:var(--bad); margin-top:6px; font-style:italic; }
.qcard.is-hidden{ opacity:.5; }
.hide-btn{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
  background:none; border:1px solid var(--line); color:var(--ink-soft); padding:2px 7px; border-radius:10px; cursor:pointer;
}
.hide-btn:hover{ border-color:var(--brass); color:var(--brass); }
.del-btn{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
  background:none; border:1px solid var(--line); color:var(--bad); padding:2px 7px; border-radius:10px; cursor:pointer;
}
.del-btn:hover{ border-color:var(--bad); background:var(--bad); color:#fff; }
.qcard-check{ display:flex; align-items:center; cursor:pointer; margin-right:2px; }
.qcard-check input{ cursor:pointer; }
.empty-list{ font-size:12.5px; color:var(--ink-soft); text-align:center; padding:24px 8px; }

.select-all-row{ margin:-6px 0 10px; }
.bulk-bar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#f7ece9; border:1px solid #edd0ca; border-radius:5px; padding:9px 11px; margin-bottom:12px;
  font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;
}
.bulk-del-btn{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
  background:var(--bad); color:#fff; border:none; padding:6px 11px; border-radius:4px; cursor:pointer;
}
.bulk-del-btn:hover{ background:#8a3a32; }

.list-filters{ margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line); }
.date-filter{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.date-filter input{
  flex:1; min-width:0; padding:6px 7px; border:1px solid var(--line); border-radius:4px; font-size:11.5px;
  font-family:'IBM Plex Mono',monospace; background:#fff; color:var(--ink);
}
.date-filter .to-sep{ font-size:11px; color:var(--ink-soft); }
.hidden-toggle{
  display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
}
.hidden-toggle input{ cursor:pointer; }

.editor-pane{ flex:1; min-width:0; padding:28px 36px; }
.editor-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:11px; font-family:'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
.field input, .field textarea, .field select{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:4px; font-size:13.5px;
  font-family:'Work Sans',sans-serif; background:#fff; color:var(--ink);
}
.field textarea{ resize:vertical; min-height:64px; }
.details-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
.details-grid .field-name{ grid-column:1 / -1; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.section-title{ font-size:13px; font-weight:600; margin:10px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line); font-family:'Fraunces',serif;}
.li-table{ width:100%; table-layout:fixed; border-collapse:collapse; font-size:13px; }
.li-table col.c-qty{ width:13%; } .li-table col.c-unit{ width:20%; } .li-table col.c-total{ width:23%; } .li-table col.c-rm{ width:30px; }
.li-table thead th{
  background:none; border-bottom:1px solid var(--line); padding:0 4px 6px; text-align:left;
  font-size:10px; letter-spacing:.08em; color:var(--ink-soft);
}
.li-table thead th.num{ text-align:right; }
.li-table tbody td{ padding:4px; border-bottom:none; vertical-align:middle; }
.li-table input{
  width:100%; min-width:0; padding:8px 7px; border:1px solid var(--line); border-radius:4px; font-size:13px;
  font-family:'Work Sans',sans-serif; background:#fff; color:var(--ink);
}
.li-table input.li-qty, .li-table input.li-price{ text-align:right; }
.li-table td.li-total{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); text-align:right; white-space:nowrap; }
.rm-btn{ background:none; border:none; color:var(--bad); cursor:pointer; font-size:16px; width:100%; padding:0; }
.li-help{ font-size:11.5px; color:var(--ink-soft); margin:6px 4px 10px; line-height:1.5; }
.add-row-btn{ font-size:12px; color:var(--brass); background:none; border:1px dashed var(--line); padding:8px; width:100%; border-radius:4px; cursor:pointer; }
.add-row-btn:hover{ border-color:var(--brass); }

.editor-grid{ display:block; }
.editor-summary{ margin-top:24px; padding:16px 18px; background:var(--paper); border:1px solid var(--line); border-radius:6px; }
.totals-box{ margin:0 0 12px; font-family:'IBM Plex Mono',monospace; font-size:13px; }
.totals-box div{ display:flex; justify-content:space-between; padding:5px 0; color:var(--ink-soft); }
.totals-box .grand{ color:var(--ink); font-weight:600; border-top:1px solid var(--line); margin-top:4px; padding-top:9px; font-size:15px; }
.save-state{ display:flex; align-items:center; gap:10px; min-height:20px; margin-bottom:8px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; }
.unsaved-flag{ display:inline-flex; align-items:center; gap:6px; color:#8a5a14; }
.unsaved-flag::before{ content:""; width:7px; height:7px; border-radius:50%; background:#d19a3a; }
.unsaved-flag[hidden]{ display:none; }
.sum-actions{ display:flex; flex-wrap:wrap; gap:8px; }
.sum-actions .btn{ padding:10px 12px; }
.sum-actions .btn-primary{ flex:1 1 100%; }
.sum-actions .btn-ghost{ flex:1 1 130px; }
.btn{ padding:10px 18px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }
.btn:disabled{ opacity:.6; cursor:default; }
.btn-primary{ background:var(--brass); color:#fff; }
.btn-primary:hover{ background:var(--oak); }
.btn-ghost{ background:none; border-color:var(--line); color:var(--ink); }
.btn-ghost:hover{ border-color:var(--brass); color:var(--brass); }
.link-box{ display:flex; gap:8px; align-items:center; margin-top:14px; }
.link-box input{ flex:1; min-width:0; padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; border:1px solid var(--line); border-radius:4px; background:#fff; }
.link-box .btn{ padding:8px 12px; }
.link-note{ font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.5; }
.response-box{ margin-top:22px; padding:14px 16px; border-radius:5px; }
.response-box.accepted{ background:#eaf1eb; }
.response-box.declined{ background:#f7ece9; }
.response-box .rt{ font-size:13px; font-weight:600; margin-bottom:4px; }
.response-box .rr{ font-size:12.5px; color:var(--ink-soft); }
.saved-flash{ font-size:12px; color:var(--ok); font-family:'IBM Plex Mono',monospace; opacity:0; transition:opacity 200ms; }
.saved-flash.show{ opacity:1; }

/* ===== CUSTOMER (booklet) ===== */
#customer{ display:none; min-height:100vh; align-items:center; justify-content:center; padding:48px 16px;
  background:radial-gradient(ellipse at 50% -10%, #4a372a 0%, var(--bark) 55%), var(--bark); }
.stage{ width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:22px; }
.book-wrap{ position:relative; width:100%; aspect-ratio:1000/1400; }
.spine-shadow{ position:absolute; inset:0; border-radius:6px; box-shadow:0 30px 60px -20px rgba(0,0,0,.65), 0 10px 25px -10px rgba(0,0,0,.5); pointer-events:none; z-index:-1; }
.book-back{ position:absolute; inset:0; background:#272727; border-radius:6px; }
#book{ width:100%; height:100%; }
.page{ position:relative; height:100%; padding:26px 22px 22px 32px; display:flex; flex-direction:column; overflow:hidden auto; background:var(--paper); border-radius:6px; border:1px solid var(--line); }
.page::before{ content:""; position:absolute; top:0; left:0; bottom:0; width:18px; background:linear-gradient(to right, rgba(36,26,20,.16), transparent); z-index:1; }
.page.img-page{ padding:0; overflow:hidden; }
.page-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.cover-fields{ position:absolute; left:48%; width:40%; top:85.5%; text-align:right; display:flex; flex-direction:column; gap:.15em; line-height:1.15; color:#f3ede1; font-family:'IBM Plex Mono',monospace; z-index:2; }
.cover-fields .cf-name{ font-size:.85em; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cover-fields .cf-ref, .cover-fields .cf-date{ font-size:.68em; color:#d8c8ae; white-space:nowrap; }
.cover{ background:radial-gradient(120% 90% at 15% 0%, #4d3826 0%, transparent 55%), linear-gradient(155deg, var(--walnut), var(--bark) 70%); color:var(--linen); justify-content:space-between; padding-left:56px; }
.cover .mark{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.3em; color:var(--brass); text-transform:uppercase; }
.cover h1{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(34px,5.5vw,52px); line-height:1.02; margin:16px 0 0; }
.cover .rule{ width:64px; height:2px; background:var(--brass); margin:20px 0; }
.cover .sub{ font-size:13.5px; color:#d8c8ae; max-width:340px; line-height:1.55; }
.cover .meta{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#cbb896; line-height:1.9; }
.cover .meta b{ color:var(--linen); font-weight:500; }
h2.title{ font-family:'Fraunces',serif; font-weight:600; font-size:28px; margin:0 0 16px; color:var(--ink); }
.pageno{ position:absolute; bottom:16px; right:56px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); letter-spacing:.1em; }
.about p{ font-size:14px; line-height:1.7; color:var(--ink-soft); max-width:60ch; }
.streams{ display:flex; gap:12px; margin-top:18px; }
.stream{ flex:1; border:1px solid var(--line); border-radius:4px; padding:12px 13px 14px; background:linear-gradient(180deg,#fff,var(--paper)); }
.stream .n{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--brass); letter-spacing:.15em; }
.stream .t{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin:4px 0; }
.stream .d{ font-size:11.5px; color:var(--ink-soft); line-height:1.5; }
.quotebox{ border:1px solid var(--line); border-radius:4px; overflow:hidden; flex-shrink:0; }
table{ width:100%; border-collapse:collapse; font-size:12.5px; }
thead th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); background:var(--linen); padding:8px 11px; border-bottom:1px solid var(--line); }
tbody td{ padding:9px 11px; border-bottom:1px solid var(--line); color:var(--ink); }
tbody tr:last-child td{ border-bottom:none; }
td.num, th.num{ text-align:right; font-family:'IBM Plex Mono',monospace; }
.totals{ margin-top:12px; align-self:flex-end; width:220px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; flex-shrink:0; }
.totals div{ display:flex; justify-content:space-between; padding:4px 0; color:var(--ink-soft); }
.totals .grand{ color:var(--ink); font-weight:600; border-top:1px solid var(--line); margin-top:3px; padding-top:8px; font-size:14.5px; }
.note{ margin-top:14px; font-size:11px; color:var(--ink-soft); font-style:italic; white-space:pre-wrap; flex-shrink:0; }
.swatches{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:4px; }
.swatch{ border-radius:4px; overflow:hidden; border:1px solid var(--line); background:#fff; }
.swatch .tile{ height:64px; }
.t1{ background:repeating-linear-gradient(100deg,#a97e4f 0 10px,#8f6a41 10px 20px); }
.t2{ background:repeating-linear-gradient(45deg,#5b4331 0 8px,#6f5238 8px 16px); }
.t3{ background:linear-gradient(135deg,#c9bda3,#e4dcc9); }
.t4{ background:repeating-linear-gradient(90deg,#7a6a52 0 6px,#8c7a5f 6px 12px); }
.t5{ background:linear-gradient(135deg,#3c2c22,#5c4432); }
.t6{ background:repeating-linear-gradient(120deg,#c2a06b 0 12px,#b08d57 12px 24px); }
.swatch .cap{ padding:8px 9px 10px; }
.swatch .cap .p{ font-family:'Fraunces',serif; font-weight:600; font-size:12.5px; }
.swatch .cap .s{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-soft); margin-top:2px; }
.svc-grid{ display:flex; gap:24px; margin-top:4px; }
.svc-col{ flex:1; }
.svc-col h3{ font-family:'Fraunces',serif; font-size:14px; margin:0 0 9px; }
.svc-col ul{ margin:0; padding-left:0; list-style:none; }
.svc-col li{ font-size:12.5px; color:var(--ink-soft); line-height:1.65; padding-left:15px; position:relative; }
.svc-col li::before{ content:"—"; position:absolute; left:0; color:var(--brass); }
.contact{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); line-height:1.85; }
.contact b{ color:var(--ink); font-weight:500; }
.decision{ justify-content:center; align-items:center; text-align:center; }
/* StPageFlip forces inline display:block on the page element mid-flip, which defeats the
   .decision flex-centering above (justify/align-items only work on a flex container). Centering
   is done instead on this absolutely-positioned inner wrapper, which stays flex regardless. */
.decision-inner{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:26px 22px 22px 32px; box-sizing:border-box; }
.decision h2.title{ margin-bottom:8px; }
.decision p.lead{ font-size:13.5px; color:var(--ink-soft); max-width:44ch; margin:0 0 24px; }
.decision-btns{ display:flex; gap:12px; }
.dbtn{ padding:12px 22px; border-radius:5px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }
.dbtn.accept{ background:var(--ok); color:#fff; }
.dbtn.accept:hover{ background:#3f5a42; }

<script>
/* ---------------- settings ---------------- */
// A "sent" quote shows up under Reminders once it has been waiting longer than this many days.
const REMINDER_AFTER_DAYS = 5;

// Printed on the "Print quote" output. Fill these in; any field left empty is simply not printed.
const BUSINESS = { businessName:'', phone:'', email:'', address:'' };

/* ---------------- Supabase storage ---------------- */
const SUPABASE_URL = 'https://lpkdsdfltejgczsuvpay.supabase.co';
const SUPABASE_KEY = 'sb_publishable_v9LluInQJDNQmMHnbxixWQ_Otl-hvvG';
// The anon key is public by design. It can only sign in and call the customer functions
// (get_quote / record_view / submit_decision); the tables themselves need a signed-in user.
const ANON_HEADERS = { apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY };

/* ---------------- admin sign-in (Supabase Auth, email + password) ---------------- */
const SESSION_KEY = 'dcf.session';
let session = null;            // { access_token, refresh_token, expires_at (unix seconds) }
let signedOutNotice = '';      // shown on the login screen after an expired session
let refreshPromise = null;
const nowSec = ()=> Math.floor(Date.now()/1000);
function readStoredSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    return (s && s.access_token && s.refresh_token) ? s : null;
  }catch(e){ return null; }
}
function setSession(s){
  session = s;
  try{ if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }catch(e){ /* private mode: stay signed in for this tab only */ }
}
function toSession(j){
  return { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: j.expires_at || (nowSec() + (j.expires_in || 3600)) };
}
async function authCall(path, body){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  let json = null; try{ json = await res.json(); }catch(e){}
  return { ok:res.ok, status:res.status, json };
}
async function signIn(email, password){
  try{
    const r = await authCall('token?grant_type=password', { email, password });
    if(r.ok && r.json && r.json.access_token){ setSession(toSession(r.json)); sessionEnded = false; return { ok:true }; }
    const code = (r.json && (r.json.error_code || r.json.error)) || '';
    if(r.status === 429 || code === 'over_request_rate_limit') return { ok:false, message:'Too many attempts. Please wait a minute and try again.' };
    if(code === 'email_not_confirmed') return { ok:false, message:'Please confirm your email address before signing in.' };
    if(r.status >= 400 && r.status < 500) return { ok:false, message:"That email or password isn't right. Please try again." };
    return { ok:false, message:"Sorry, we couldn't sign you in just now. Please try again in a moment." };
  }catch(e){
    return { ok:false, message:"Couldn't reach the server. Check your connection and try again." };
  }
}
/* Returns an access token, null (not signed in / session ended) or undefined (couldn't reach the server,
   session kept). Refreshes shortly before expiry; if another tab already refreshed, uses its token. */
async function getAccessToken(force = false){
  if(!session) session = readStoredSession();
  if(!session) return null;
  if(!force && session.expires_at - 30 > nowSec()) return session.access_token;
  const stored = readStoredSession();
  if(stored && stored.access_token !== session.access_token && stored.expires_at - 30 > nowSec()){ session = stored; return session.access_token; }
  if(!refreshPromise){
    refreshPromise = (async()=>{
      try{
        const r = await authCall('token?grant_type=refresh_token', { refresh_token: session.refresh_token });
        if(r.ok && r.json && r.json.access_token){ setSession(toSession(r.json)); return session.access_token; }
        if(r.status >= 400 && r.status < 500){ setSession(null); return null; }   // refresh token rejected
        return undefined;
      }catch(e){ return undefined; }
      finally{ refreshPromise = null; }
    })();
  }
  return refreshPromise;
}
/* Every admin request goes through here and carries the signed-in user's token, never the anon key. */
async function adminFetch(path, opts = {}){
  const send = token => fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...opts, headers:{ apikey:SUPABASE_KEY, ...(opts.headers || {}), Authorization:'Bearer '+token } });
  let token = await getAccessToken();
  if(token === null){ endSession(); throw new Error('signed out'); }
  if(!token) throw new Error('could not reach the sign-in service');
  let res = await send(token);
  if(res.status === 401){
    token = await getAccessToken(true);
    if(token === null){ endSession(); throw new Error('signed out'); }
    if(!token) throw new Error('could not reach the sign-in service');
    res = await send(token);
    if(res.status === 401){ endSession(); throw new Error('signed out'); }
  }
  return res;
}
let sessionEnded = false;
function endSession(){
  if(sessionEnded) return;   // several requests can fail at once; only react once
  sessionEnded = true;
  setSession(null);
  signedOutNotice = 'Your session has ended. Please sign in again.';
  resetAdminState();
  route();
}
function resetAdminState(){
  draft = null; currentRef = null; quoteCache = null; selectedRefs = new Set();
  searchTerm = ''; filterFrom = ''; filterTo = ''; showHidden = false; listTab = 'all';
  isDirty = false;
  ['qList','editorPane'].forEach(id=>{ const el = document.getElementById(id); if(el) el.innerHTML = ''; });
  ['searchInput','filterFrom','filterTo'].forEach(id=>{ const el = document.getElementById(id); if(el) el.value = ''; });
  ['showHiddenChk','selectAllChk'].forEach(id=>{ const el = document.getElementById(id); if(el){ el.checked = false; el.indeterminate = false; } });
}
function signOut(){
  if(!confirmDiscard()) return;
  const token = session && session.access_token;
  setSession(null);
  signedOutNotice = '';
  resetAdminState();
  if(token) fetch(`${SUPABASE_URL}/auth/v1/logout?scope=local`, { method:'POST', headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+token } }).catch(()=>{});
  route();
}

/* Customer pages call these database functions with the anon key; they take the random short slug only. */
async function rpc(fn, args){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:'POST', headers:{ ...ANON_HEADERS, 'Content-Type':'application/json' }, body: JSON.stringify(args) });
  if(!res.ok) throw new Error(`${fn} failed (${res.status})`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function toDbRow(q, full){
  const row = {
    ref: q.ref,
    customer_name: q.customerName || '',
    date: q.date || null,
    valid_until: q.validUntil || null,
    line_items: q.lineItems || [],
    notes: q.notes || '',
    gallery: q.gallery || [],
    hidden: !!q.hidden,
    short_slug: q.shortSlug || null,
    updated_at: new Date().toISOString()
  };
  // status/response are only written when a quote is first created. After that the customer's decision
  // is owned by submit_decision(), and an open editor must never be able to overwrite it.
  if(full){ row.status = q.status || 'draft'; row.response = q.response || null; }
  return row;
}
function fromDbRow(r){
  return {
    ref: r.ref,
    customerName: r.customer_name || '',
    date: r.date || '',
    validUntil: r.valid_until || '',
    lineItems: (r.line_items && r.line_items.length) ? r.line_items : [{product:'',qty:'',unitPrice:''}],
    notes: r.notes || '',
    gallery: (r.gallery && r.gallery.length) ? r.gallery : [{name:'',ref:'',tex:'t1'}],
    status: r.status || 'draft',
    response: r.response || null,
    hidden: !!r.hidden,
    shortSlug: r.short_slug || null,
    createdAt: r.created_at,
    updatedAt: r.updated_at,
    firstViewedAt: r.first_viewed_at || null,
    lastViewedAt: r.last_viewed_at || null,
    viewCount: r.view_count || 0
  };
}

async function getQuote(ref){
  try{
    const res = await adminFetch(`quotes?ref=eq.${encodeURIComponent(ref)}&select=*`);
    if(!res.ok) return null;
    const rows = await res.json();
    return rows[0] ? fromDbRow(rows[0]) : null;
  }catch(e){ return null; }
}
// Customer pages: one quote by its random short slug, via get_quote(). Returns null when there is no such quote
// and throws when the server can't be reached, so "not found" is never shown for a network problem.
async function getQuoteBySlug(slug){
  const r = await rpc('get_quote', { p_slug: slug });
  return r ? fromDbRow(r) : null;
}
async function saveQuote(q, full = false){
  const row = toDbRow(q, full);
  q.updatedAt = row.updated_at;
  try{
    const res = await adminFetch('quotes?on_conflict=ref', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates' },
      body: JSON.stringify(row)
    });
    return res.ok;
  }catch(e){ return false; }
}
// draft -> sent, only while it is still a draft (never touches a quote the customer has already decided)
async function markSent(ref){
  try{
    const res = await adminFetch(`quotes?ref=eq.${encodeURIComponent(ref)}&status=eq.draft`, {
      method:'PATCH', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ status:'sent' })
    });
    return res.ok;
  }catch(e){ return false; }
}
async function listQuotes(){
  try{
    const res = await adminFetch('quotes?select=*&order=updated_at.desc');
    if(!res.ok) return [];
    const rows = await res.json();
    return rows.map(fromDbRow);
  }catch(e){ return []; }
}
async function deleteQuoteRow(ref){
  try{
    const res = await adminFetch(`quotes?ref=eq.${encodeURIComponent(ref)}`, { method:'DELETE' });
    return res.ok;
  }catch(e){ return false; }
}
async function deleteQuoteRows(refs){
  try{
    const list = refs.map(r=>encodeURIComponent(r)).join(',');
    const res = await adminFetch(`quotes?ref=in.(${list})`, { method:'DELETE' });
    return res.ok;
  }catch(e){ return false; }
}
/* Customer view tracking: one record_view() call per page load. Best-effort, a failure never reaches the customer. */
const viewedThisLoad = new Set();
function recordView(slug){
  if(viewedThisLoad.has(slug)) return;
  viewedThisLoad.add(slug);
  rpc('record_view', { p_slug: slug }).catch(()=>{});
}
async function nextRef(){
  return 'DCF-' + Date.now().toString().slice(-6);
}
// The short slug is the only thing that gives a customer access to a quote, so it has to be unguessable:
// 10 characters from crypto.getRandomValues (about 58 bits), with rejection sampling so every character is
// equally likely. Older quotes keep their existing slugs.
const SLUG_LENGTH = 10;
function genSlug(len = SLUG_LENGTH){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const limit = 256 - (256 % chars.length);
  let s = '';
  while(s.length < len){
    for(const b of crypto.getRandomValues(new Uint8Array(len * 2))){
      if(b < limit && s.length < len) s += chars[b % chars.length];
    }
  }
  return s;
}

/* ---------------- defaults ---------------- */
function blankQuote(ref){
  const today = new Date(); const valid = new Date(today.getTime()+14*86400000);
  return {
    ref, customerName:'', date: today.toISOString().slice(0,10), validUntil: valid.toISOString().slice(0,10),
    lineItems: [{product:'', qty:'', unitPrice:''}],
    notes:'Price valid for 14 days. 25% deposit required to confirm your fitting date.',
    gallery: [{name:'', ref:'', tex:'t1'}],
    status:'draft', response:null, hidden:false, shortSlug: genSlug(),
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
}
function money(n){ return '£' + (isNaN(n)?0:n).toFixed(2); }
function calcTotals(q){
  const subtotal = q.lineItems.reduce((s,li)=>{
    const qty = parseFloat(li.qty), price = parseFloat(li.unitPrice)||0;
    return s + (qty ? qty*price : price);
  },0);
  const vat = subtotal*0.2;
  return { subtotal, vat, total: subtotal+vat };
}

/* ---------------- ADMIN render ---------------- */
let currentRef = null;
let draft = null;
let filterFrom = '';
let filterTo = '';
let showHidden = false;
let searchTerm = '';
let listTab = 'all';          // 'all' | 'reminders'
let quoteCache = null;        // last list fetched from Supabase (search/filter/tab changes reuse it)
let selectedRefs = new Set();
let isDirty = false;          // editor has changes that haven't been saved
let editVersion = 0;          // bumps on every edit, so a save only clears "unsaved" if nothing changed meanwhile
let saving = false;
const DAY_MS = 86400000;

async function loadQuotes(force){
  if(force || quoteCache === null) quoteCache = await listQuotes();
  return quoteCache;
}
function visibleQuotes(all){
  const term = searchTerm.trim().toLowerCase();
  let quotes = all;
  if(!showHidden) quotes = quotes.filter(q=> !q.hidden);
  if(filterFrom) quotes = quotes.filter(q=> q.date && q.date >= filterFrom);
  if(filterTo) quotes = quotes.filter(q=> q.date && q.date <= filterTo);
  if(term) quotes = quotes.filter(q=> matchesSearch(q, term));
  return quotes;
}
function matchesSearch(q, term){
  return (q.customerName||'').toLowerCase().includes(term) || (q.ref||'').toLowerCase().includes(term);
}

/* reminders: sent, not hidden, created more than REMINDER_AFTER_DAYS ago, oldest first */
function quoteAgeDays(q){
  const t = Date.parse(q.createdAt || q.date || '');
  return isNaN(t) ? null : (Date.now() - t) / DAY_MS;
}
function reminderQuotes(all){
  return all
    .filter(q=>{ const age = quoteAgeDays(q); return q.status==='sent' && !q.hidden && age!==null && age > REMINDER_AFTER_DAYS; })
    .sort((a,b)=> quoteAgeDays(b) - quoteAgeDays(a));
}
function timeAgo(iso){
  const t = Date.parse(iso || '');
  if(isNaN(t)) return '';
  const mins = Math.floor((Date.now() - t) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins} minute${mins===1?'':'s'} ago`;
  const hours = Math.floor(mins / 60);
  if(hours < 24) return `${hours} hour${hours===1?'':'s'} ago`;
  const days = Math.floor(hours / 24);
  if(days < 30) return `${days} day${days===1?'':'s'} ago`;
  return 'on ' + fmtDate(new Date(t).toISOString().slice(0,10));
}
function viewsLabel(q){
  const n = q.viewCount || 0;
  if(!n) return 'Not opened';
  const ago = q.lastViewedAt ? timeAgo(q.lastViewedAt) : '';
  return `Opened ${n} ${n===1?'time':'times'}${ago ? ', last viewed ' + ago : ''}`;
}
function viewsHtml(q){
  return `<div class="views ${q.viewCount ? 'opened' : ''}">${escapeHtml(viewsLabel(q))}</div>`;
}
function quoteLink(q){
  return `${siteBase()}/q/${encodeURIComponent(q.shortSlug || '')}`;
}
function followUpMessage(q){
  const name = (q.customerName||'').trim();
  return `Hi ${name || 'there'}, hope you're well! Just checking in to see if you've had a chance to look over your flooring quote:\n\n${quoteLink(q)}\n\nAny questions at all, just let me know. Thanks!`;
}
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){ /* fall through to the legacy path */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed; top:0; left:0; opacity:0;';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}
function flashButton(btn, text){
  if(!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = text;
  clearTimeout(btn._flashTimer);
  btn._flashTimer = setTimeout(()=>{ btn.textContent = btn.dataset.label; }, 1400);
}

function syncTabUi(){
  const isRem = listTab === 'reminders';
  document.querySelectorAll('.list-tab').forEach(t=>{
    const on = t.dataset.tab === listTab;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('listFilters').style.display = isRem ? 'none' : '';
  document.getElementById('selectAllRow').style.display = isRem ? 'none' : '';
  if(isRem) document.getElementById('bulkBar').style.display = 'none';
}
function setListTab(tab){
  listTab = tab;
  syncTabUi();
  renderList(false);
}

function emptyListHtml(){
  const term = searchTerm.trim();
  if(term) return `<div class="empty-list"><strong>No quotes found</strong><br>Nothing matches “${escapeHtml(term)}”.</div>`;
  if(listTab === 'reminders') return `<div class="empty-list">Nothing to chase right now. Sent quotes show up here once they've been waiting more than ${REMINDER_AFTER_DAYS} days.</div>`;
  return '<div class="empty-list">No quotes match — create one or adjust your filters.</div>';
}

async function renderList(force = true){
  const all = await loadQuotes(force);
  const allReminders = reminderQuotes(all);
  const badge = document.getElementById('reminderBadge');
  badge.textContent = allReminders.length;
  badge.classList.toggle('zero', allReminders.length === 0);
  syncTabUi();

  const el = document.getElementById('qList');
  if(listTab === 'reminders'){
    const term = searchTerm.trim().toLowerCase();
    const reminders = term ? allReminders.filter(q=> matchesSearch(q, term)) : allReminders;
    if(!reminders.length){ el.innerHTML = emptyListHtml(); return; }
    const reminderCard = q=>{
      const days = Math.floor(quoteAgeDays(q));
      return `<div class="qcard ${q.ref===currentRef?'active':''}" data-ref="${escapeHtml(q.ref)}">
        <div class="row1">
          <div class="row1-left"><span class="ref">${escapeHtml(q.ref)}</span></div>
          <span class="waiting">Waiting ${days} day${days===1?'':'s'}</span>
        </div>
        <div class="name">${escapeHtml(q.customerName)||'Unnamed customer'}</div>
        <div class="row3"><span class="total">${money(calcTotals(q).total)}</span></div>
        ${viewsHtml(q)}
        <button class="copy-fu-btn" data-ref="${escapeHtml(q.ref)}">Copy follow-up message</button>
      </div>`;
    };
    const sections = [
      ['Never opened', reminders.filter(q=> !q.viewCount)],
      ['Opened, no decision', reminders.filter(q=> q.viewCount > 0)]
    ].filter(([, list])=> list.length);
    el.innerHTML = sections.map(([title, list])=>
      `<div class="list-section"><span>${title}</span><span>${list.length}</span></div>${list.map(reminderCard).join('')}`
    ).join('');
    Array.from(el.querySelectorAll('.qcard')).forEach(c=>{
      c.addEventListener('click', ()=> openEditor(c.dataset.ref));
    });
    Array.from(el.querySelectorAll('.copy-fu-btn')).forEach(btn=>{
      btn.addEventListener('click', async e=>{
        e.stopPropagation();
        const q = reminders.find(r=> r.ref === btn.dataset.ref);
        if(!q) return;
        if(!q.shortSlug){   // very old quote without a short link yet
          q.shortSlug = genSlug();
          if(!(await saveQuote(q))){ flashButton(btn, 'Copy failed'); return; }
        }
        const ok = await copyText(followUpMessage(q));
        flashButton(btn, ok ? 'Copied ✓' : 'Copy failed');
      });
    });
    return;
  }

  const quotes = visibleQuotes(all);
  // drop selections for refs no longer in the visible (filtered) list
  const visibleRefs = new Set(quotes.map(q=>q.ref));
  Array.from(selectedRefs).forEach(r=>{ if(!visibleRefs.has(r)) selectedRefs.delete(r); });

  const bulkBar = document.getElementById('bulkBar');
  const selectAllChk = document.getElementById('selectAllChk');
  if(!quotes.length){
    el.innerHTML = emptyListHtml();
    bulkBar.style.display = 'none';
    selectAllChk.checked = false; selectAllChk.indeterminate = false;
    return;
  }

  bulkBar.style.display = selectedRefs.size ? 'flex' : 'none';
  document.getElementById('bulkCount').textContent = selectedRefs.size;
  selectAllChk.checked = selectedRefs.size === quotes.length;
  selectAllChk.indeterminate = selectedRefs.size > 0 && selectedRefs.size < quotes.length;

  el.innerHTML = quotes.map(q=>{
    const {total} = calcTotals(q);
    let reasonHtml = '';
    if(q.status==='declined' && q.response && q.response.reason){
      reasonHtml = `<div class="reason">"${escapeHtml(q.response.reason)}"</div>`;
    }
    return `<div class="qcard ${q.ref===currentRef?'active':''} ${q.hidden?'is-hidden':''}" data-ref="${q.ref}">
      <div class="row1">
        <div class="row1-left">
          <label class="qcard-check" onclick="event.stopPropagation()">
            <input type="checkbox" class="sel-chk" data-ref="${q.ref}" ${selectedRefs.has(q.ref)?'checked':''}>
          </label>
          <span class="ref">${q.ref}</span>
        </div>
        <span class="pill ${q.status}">${q.status}</span>
      </div>
      <div class="name">${escapeHtml(q.customerName)||'Unnamed customer'}</div>
      <div class="row3">
        <span class="total">${money(total)}</span>
        <div class="actions">
          <button class="hide-btn" data-ref="${q.ref}" data-hidden="${q.hidden?1:0}">${q.hidden?'Unhide':'Hide'}</button>
          <button class="del-btn" data-ref="${q.ref}" title="Delete permanently">Delete</button>
        </div>
      </div>
      ${viewsHtml(q)}
      ${reasonHtml}
    </div>`;
  }).join('');
  Array.from(el.querySelectorAll('.qcard')).forEach(c=>{
    c.addEventListener('click', ()=> openEditor(c.dataset.ref));
  });
  Array.from(el.querySelectorAll('.sel-chk')).forEach(chk=>{
    chk.addEventListener('click', e=> e.stopPropagation());
    chk.addEventListener('change', e=>{
      const ref = chk.dataset.ref;
      if(chk.checked) selectedRefs.add(ref); else selectedRefs.delete(ref);
      renderList(false);
    });
  });
  Array.from(el.querySelectorAll('.hide-btn')).forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ref = btn.dataset.ref;
      const wasHidden = btn.dataset.hidden === '1';
      const q = await getQuote(ref);
      if(!q) return;
      q.hidden = !wasHidden;
      await saveQuote(q);
      if(draft && draft.ref===ref) draft.hidden = q.hidden;
      renderList();
    });
  });
  Array.from(el.querySelectorAll('.del-btn')).forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ref = btn.dataset.ref;
      if(!confirm(`Delete quote ${ref}? This can't be undone.`)) return;
      const ok = await deleteQuoteRow(ref);
      if(!ok){ alert('Could not delete — please try again.'); return; }
      selectedRefs.delete(ref);
      if(draft && draft.ref===ref){
        draft = null; currentRef = null; setDirty(false);
        await route();
      } else {
        renderList();
      }
    });
  });
}

// Switching quotes (or starting a new one) would throw away edits that haven't been saved.
function confirmDiscard(){
  return !isDirty || confirm('You have unsaved changes to this quote. Discard them and continue?');
}

async function openEditor(ref){
  if(!confirmDiscard()) return;
  const loaded = await getQuote(ref);
  if(!loaded){ if(session || readStoredSession()) alert("Couldn't load that quote. Please try again."); return; }
  currentRef = ref;
  draft = loaded;
  if(!draft.shortSlug){ draft.shortSlug = genSlug(); await saveQuote(draft); }
  isDirty = false;
  renderEditor();
  renderList(false);
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function lineTotal(li){
  const qty = parseFloat(li.qty), price = parseFloat(li.unitPrice)||0;
  return qty ? qty*price : price;
}
function liRowHtml(li, i){
  return `<tr class="li-row" data-i="${i}">
    <td><input class="li-product" aria-label="Description" placeholder="Product / SKU" value="${escapeHtml(li.product)}"></td>
    <td><input class="li-qty" aria-label="Qty" inputmode="decimal" placeholder="Qty" value="${escapeHtml(li.qty)}"></td>
    <td><input class="li-price" aria-label="Unit price" inputmode="decimal" placeholder="0.00" value="${escapeHtml(li.unitPrice)}"></td>
    <td class="li-total">${money(lineTotal(li))}</td>
    <td><button class="rm-btn" title="Remove" aria-label="Remove line item">×</button></td>
  </tr>`;
}
function renderLineItems(){
  document.getElementById('liRows').innerHTML = draft.lineItems.map(liRowHtml).join('');
  refreshTotalsOnly();
}
function addLineItem(){
  draft.lineItems.push({product:'',qty:'',unitPrice:''});
  markEdited();
  renderLineItems();
  const rows = document.querySelectorAll('#liRows .li-row');
  const last = rows[rows.length-1];
  if(last) last.querySelector('.li-product').focus();
}

function setDirty(v){
  isDirty = v;
  const flag = document.getElementById('unsavedFlag');
  if(flag) flag.hidden = !v;
}
function markEdited(){
  editVersion++; setDirty(true);
  const flash = document.getElementById('savedFlash');
  if(flash) flash.classList.remove('show');
}

function renderEditor(){
  const pane = document.getElementById('editorPane');
  let responseHtml = '';
  if(draft.response){
    const cls = draft.response.decision;
    responseHtml = `<div class="response-box ${cls}">
      <div class="rt">Customer ${cls==='accepted'?'accepted this quote':'declined this quote'} — ${new Date(draft.response.respondedAt).toLocaleDateString('en-GB')}</div>
      ${draft.response.reason ? `<div class="rr">"${escapeHtml(draft.response.reason)}"</div>` : ''}
    </div>`;
  }

  pane.innerHTML = `
    <div class="editor-header">
      <div>
        <div class="eyebrow">${draft.ref} <span class="pill ${draft.status}" style="margin-left:8px;">${draft.status}</span></div>
        <h2 style="font-size:22px;">${draft.customerName ? escapeHtml(draft.customerName) : 'New quote'}</h2>
      </div>
    </div>

    <div class="editor-grid">
      <div class="editor-main">
        <div class="details-grid">
          <div class="field field-name"><label for="f-name">Customer name</label><input id="f-name" value="${escapeHtml(draft.customerName)}"></div>
          <div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="${draft.date}"></div>
          <div class="field"><label for="f-valid">Valid until</label><input id="f-valid" type="date" value="${draft.validUntil}"></div>
        </div>

        <div class="section-title">Line items</div>
        <table class="li-table">
          <colgroup><col><col class="c-qty"><col class="c-unit"><col class="c-total"><col class="c-rm"></colgroup>
          <thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Line total</th><th><span class="sr-only">Remove</span></th></tr></thead>
          <tbody id="liRows"></tbody>
        </table>
        <div class="li-help">Leave Qty blank for a flat price — the unit price is then used as the line total.</div>
        <button class="add-row-btn" id="addLi">+ Add line item</button>

        <div class="field" style="margin-top:22px;"><label for="f-notes">Notes / terms (shown on quote)</label><textarea id="f-notes">${escapeHtml(draft.notes)}</textarea></div>

        ${responseHtml}
      </div>

      <aside class="editor-summary" aria-label="Quote summary">
        <div class="totals-box"></div>
        <div class="save-state">
          <span class="unsaved-flag" id="unsavedFlag" hidden>Unsaved changes</span>
          <span class="saved-flash" id="savedFlash">Saved</span>
        </div>
        <div class="sum-actions">
          <button class="btn btn-primary" id="saveBtn">Save quote</button>
          <button class="btn btn-ghost" id="previewBtn">Preview as customer</button>
          <button class="btn btn-ghost" id="printBtn">Print quote</button>
        </div>
        <div class="link-box">
          <input id="linkOut" readonly value="${siteBase()}/q/${draft.shortSlug || ''}">
          <button class="btn btn-ghost" id="copyBtn">Copy link</button>
        </div>
        <div class="link-note">Anyone with this link can view and respond to this quote.</div>
      </aside>
    </div>
  `;

  renderLineItems();
  setDirty(isDirty);

  // wire up
  document.getElementById('f-name').addEventListener('input', e=> draft.customerName = e.target.value);
  document.getElementById('f-date').addEventListener('input', e=> draft.date = e.target.value);
  document.getElementById('f-valid').addEventListener('input', e=> draft.validUntil = e.target.value);
  document.getElementById('f-notes').addEventListener('input', e=> draft.notes = e.target.value);

  document.getElementById('addLi').addEventListener('click', addLineItem);

  const tbody = document.getElementById('liRows');
  tbody.addEventListener('input', e=>{
    const row = e.target.closest('.li-row'); if(!row) return;
    const li = draft.lineItems[+row.dataset.i];
    if(e.target.classList.contains('li-product')) li.product = e.target.value;
    else if(e.target.classList.contains('li-qty')){ li.qty = e.target.value; refreshTotalsOnly(); }
    else if(e.target.classList.contains('li-price')){ li.unitPrice = e.target.value; refreshTotalsOnly(); }
  });
  tbody.addEventListener('keydown', e=>{
    if(e.key !== 'Enter' || e.isComposing || !e.target.matches('input')) return;
    const row = e.target.closest('.li-row'); if(!row) return;
    if(+row.dataset.i !== draft.lineItems.length-1) return;   // only the last row adds a new one
    e.preventDefault();
    addLineItem();
  });
  tbody.addEventListener('click', e=>{
    const rm = e.target.closest('.rm-btn'); if(!rm) return;
    const i = +rm.closest('.li-row').dataset.i;
    draft.lineItems.splice(i,1);
    if(!draft.lineItems.length) draft.lineItems.push({product:'',qty:'',unitPrice:''});
    markEdited();
    renderLineItems();
  });

  document.getElementById('saveBtn').addEventListener('click', saveCurrent);
  document.getElementById('previewBtn').addEventListener('click', async ()=>{
    const v = editVersion;
    const ok = await saveQuote(draft);
    if(ok && v === editVersion) setDirty(false);
    history.pushState(null, '', `${siteBase()}/q/${encodeURIComponent(draft.shortSlug)}?preview=1`);
    route();
  });
  document.getElementById('printBtn').addEventListener('click', printQuote);
  document.getElementById('copyBtn').addEventListener('click', async ()=>{
    const ok = await copyText(document.getElementById('linkOut').value);
    flashButton(document.getElementById('copyBtn'), ok ? 'Copied' : 'Copy failed');
  });
}

async function saveCurrent(){
  if(!draft || saving) return false;
  saving = true;
  const btn = document.getElementById('saveBtn');
  if(btn) btn.disabled = true;
  const v = editVersion;
  let ok = await saveQuote(draft);
  if(ok && draft.status === 'draft'){
    ok = await markSent(draft.ref);
    if(ok) draft.status = 'sent';
  }
  saving = false;
  const btnNow = document.getElementById('saveBtn');
  if(btnNow) btnNow.disabled = false;
  if(!ok){
    alert('Could not save — please try again.');
    return false;
  }
  // pick up a decision the customer may have made while this editor was open
  const fresh = await getQuote(draft.ref);
  if(fresh){ draft.status = fresh.status; draft.response = fresh.response; }
  if(v === editVersion) setDirty(false);
  const pill = document.querySelector('.editor-header .pill');
  if(pill){ pill.className = 'pill ' + draft.status; pill.textContent = draft.status; }
  const flash = document.getElementById('savedFlash');
  if(flash){ flash.classList.add('show'); setTimeout(()=> flash.classList.remove('show'), 1600); }
  renderList();
  return true;
}

function refreshTotalsOnly(){
  const {subtotal, vat, total} = calcTotals(draft);
  const box = document.querySelector('.totals-box');
  if(box){
    box.innerHTML = `
      <div><span>Subtotal</span><span>${money(subtotal)}</span></div>
      <div><span>VAT (20%)</span><span>${money(vat)}</span></div>
      <div class="grand"><span>Total</span><span>${money(total)}</span></div>`;
  }
  document.querySelectorAll('#liRows .li-row').forEach((row,i)=>{
    row.querySelector('.li-total').textContent = money(lineTotal(draft.lineItems[i]));
  });
}

/* ---------------- print quote (A4, client-side) ---------------- */
function buildPrintHtml(q){
  const {subtotal, vat, total} = calcTotals(q);
  const items = q.lineItems.filter(li=> (li.product||'').trim() || (li.unitPrice||'').toString().trim());
  const rows = items.map(li=>{
    const price = parseFloat(li.unitPrice)||0;
    return `<tr><td>${escapeHtml(li.product)||'—'}</td><td class="num">${li.qty ? escapeHtml(li.qty) : '—'}</td><td class="num">${money(price)}</td><td class="num">${money(lineTotal(li))}</td></tr>`;
  }).join('') || '<tr><td colspan="4">Line items to follow.</td></tr>';
  const notes = (q.notes||'').trim();
  const name = (q.customerName||'').trim();
  const biz = (BUSINESS.businessName||'').trim();
  const link = quoteLink(q);
  const linkText = link.replace(/^https?:\/\//, '');
  const logo = siteBase() + '/floors-for-living-logo.png';
  const icons = {
    phone:'<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
    email:'<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
    address:'<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'
  };
  const contact = ['phone','email','address']
    .filter(k=> (BUSINESS[k]||'').trim())
    .map(k=> `<span>${icons[k]}${escapeHtml(BUSINESS[k].trim())}</span>`).join('');
  return `<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>${escapeHtml('Quote ' + q.ref + (name ? ' – ' + name : ''))}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>

.page{ width:210mm; margin:0 auto; background:#fff; }

table.items{ width:100%; border-collapse:collapse; }
.items thead{ display:table-header-group; }

.items td{ padding:4.2mm 4mm; border-bottom:.6pt solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
.items th.num, .items td.num{ text-align:right; white-space:nowrap; }
.items th:nth-child(2){ width:20mm; } .items th:nth-child(3), .items th:nth-child(4){ width:31mm; }

.closing{ margin-top:8mm; break-inside:avoid; page-break-inside:avoid; }
.totals{ width:78mm; margin-left:auto; }
.totals div{ display:flex; justify-content:space-between; padding:1.6mm 4mm; color:var(--muted); }
.totals .grand{ margin-top:2mm; padding-top:3.6mm; border-top:1.2pt solid var(--ink); font-size:16pt; font-weight:700; line-height:1.2; color:var(--accent); }
.terms{ margin-top:9mm; }
.terms p{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.accept{ margin-top:8mm; padding:5mm 6mm; background:var(--tint); border:.6pt solid #e6dcc8; border-left:1.6mm solid var(--accent); border-radius:2mm; }
.accept h3{ margin:0 0 1.5mm; font-size:11.5pt; font-weight:600; }
.accept p{ margin:0; }
.accept a{ color:var(--ink); font-weight:600; text-decoration:none; overflow-wrap:anywhere; }
.signoff{ margin-top:10mm; font-size:10pt; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }

@media print{ .page{ width:auto; } }
@media screen{ body{ background:#e6e4df; } .page{ margin:8mm auto; box-shadow:0 2px 16px rgba(0,0,0,.25); min-height:297mm; } }
</style></head>
<body><div class="page">
<div class="band">
  <div class="band-top">
    <h1><span class="a">Your flooring</span><span class="w">Quote</span></h1>
    <div class="logo-panel"><img class="logo" src="${logo}" alt="Floors for Living"></div>
  </div>
  ${contact ? `<div class="contact">${contact}</div>` : ''}
</div>
<div class="content">
  <div class="meta">
    <div><div class="label">Prepared for</div><div class="who">${escapeHtml(name) || '—'}</div></div>
    <div class="facts">
      <div><span>Quote no:</span> <b>${escapeHtml(q.ref)}</b></div>
      <div><span>Date:</span> <b>${fmtDate(q.date)}</b></div>
      <div><span>Valid until:</span> <b>${fmtDate(q.validUntil)}</b></div>
    </div>
  </div>
  <table class="items"><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="closing">
    <div class="totals"><div><span>Subtotal</span><span>${money(subtotal)}</span></div><div><span>VAT (20%)</span><span>${money(vat)}</span></div><div class="grand"><span>Total</span><span>${money(total)}</span></div></div>
    ${notes ? `<div class="terms"><div class="label">Terms</div><p>${escapeHtml(notes)}</p></div>` : ''}
    <div class="accept"><h3>Ready to go ahead?</h3><p>You can accept or decline online at <a href="${escapeHtml(link)}">${escapeHtml(linkText)}</a>. Or just reply to the message we sent you.</p></div>
    <div class="signoff">Thank you for choosing ${escapeHtml(biz) || 'us'}</div>
  </div>
</div>
</div>
<script>
window.addEventListener('load', function(){
  var go = function(){ setTimeout(function(){ window.focus(); window.print(); }, 150); };
  var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  var cap = new Promise(function(r){ setTimeout(r, 3000); });   // don't hang if the web fonts can't load
  Promise.race([fonts, cap]).then(go);
});
<\/script>
</body></html>`;
}
function printQuote(){
  if(!draft) return;
  const w = window.open('', '_blank');   // opened synchronously from the click so pop-up blockers allow it
  if(!w){ alert('Your browser blocked the print window — allow pop-ups for this site and try again.'); return; }
  w.document.open();
  w.document.write(buildPrintHtml(draft));
  w.document.close();
}

/* ---------------- list-pane + global wiring ---------------- */
document.getElementById('newQuoteBtn').addEventListener('click', async ()=>{
  if(!confirmDiscard()) return;
  const ref = await nextRef();
  draft = blankQuote(ref);
  currentRef = ref;
  await saveQuote(draft, true);
  isDirty = false;
  listTab = 'all';
  renderEditor(); renderList();
  document.getElementById('f-name').focus();
});

document.querySelectorAll('.list-tab').forEach(t=> t.addEventListener('click', ()=> setListTab(t.dataset.tab)));
document.getElementById('searchInput').addEventListener('input', e=>{ searchTerm = e.target.value; renderList(false); });
document.getElementById('filterFrom').addEventListener('change', e=>{ filterFrom = e.target.value; renderList(false); });
document.getElementById('filterTo').addEventListener('change', e=>{ filterTo = e.target.value; renderList(false); });
document.getElementById('showHiddenChk').addEventListener('change', e=>{ showHidden = e.target.checked; renderList(false); });

document.getElementById('selectAllChk').addEventListener('change', async e=>{
  const quotes = visibleQuotes(await loadQuotes(false));
  if(e.target.checked){ quotes.forEach(q=> selectedRefs.add(q.ref)); }
  else { selectedRefs.clear(); }
  renderList(false);
});
document.getElementById('bulkDeleteBtn').addEventListener('click', async ()=>{
  const refs = Array.from(selectedRefs);
  if(!refs.length) return;
  if(!confirm(`Delete ${refs.length} quote${refs.length===1?'':'s'}? This can't be undone.`)) return;
  const ok = await deleteQuoteRows(refs);
  if(!ok){ alert('Could not delete — please try again.'); return; }
  if(draft && refs.includes(draft.ref)){ draft = null; currentRef = null; setDirty(false); }
  selectedRefs.clear();
  if(!draft) await route(); else renderList();
});

// any edit inside the editor marks the quote as having unsaved changes
document.getElementById('editorPane').addEventListener('input', ()=>{ if(draft) markEdited(); });

// Ctrl/Cmd + S saves the quote being edited
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey || e.key.toLowerCase() !== 's') return;
  if(!draft || getComputedStyle(document.getElementById('admin')).display === 'none') return;
  e.preventDefault();
  saveCurrent();
});

/* ---------------- CUSTOMER render ---------------- */
const PAGE_TABS = ['Cover','About','Quote','Service','Decision'];

async function renderCustomer(routeInfo){
  const stage = document.getElementById('custStage');
  let q;
  try{ q = await getQuoteBySlug(routeInfo.value); }
  catch(e){
    stage.innerHTML = `<div class="not-found">We couldn't load your quote just now.<br>Please check your connection and refresh the page.</div>`;
    return;
  }
  if(!q){
    stage.innerHTML = `<div class="not-found">Quote <strong>${escapeHtml(routeInfo.value)}</strong> couldn't be found.<br>Double check the link, or ask DC Flooring to resend it.</div>`;
    return;
  }
  if(!isPreview()) recordView(routeInfo.value);   // not awaited, errors swallowed inside
  const {subtotal, vat, total} = calcTotals(q);
  const liRows = q.lineItems.filter(li=>li.product).map(li=>{
    const qty = parseFloat(li.qty), price=parseFloat(li.unitPrice)||0;
    const lt = qty ? qty*price : price;
    return `<tr><td>${escapeHtml(li.product)}</td><td class="num">${li.qty?escapeHtml(li.qty):'—'}</td><td class="num">${money(price)}</td><td class="num">${money(lt)}</td></tr>`;
  }).join('') || '<tr><td colspan="4" style="color:var(--ink-soft);">Line items to follow.</td></tr>';

  stage.innerHTML = `
    <div class="book-wrap">
      <div class="spine-shadow"></div>
      <div class="book-back"></div>
      <div id="book">

        <div class="page img-page" data-density="hard">
          <img class="page-bg" src="${siteBase()}/1.png" alt="DC Flooring — cover">
          <div class="cover-fields">
            <div class="cf-name">${escapeHtml(q.customerName)||'—'}</div>
            <div class="cf-ref">Ref: ${escapeHtml(q.ref)}</div>
            <div class="cf-date">${fmtDate(q.date)}</div>
          </div>
        </div>

        <div class="page img-page" data-density="hard">
          <img class="page-bg" src="${siteBase()}/2.png" alt="DC Flooring — about">
        </div>

        <div class="page img-page" data-density="hard">
          <img class="page-bg" src="${siteBase()}/3.png" alt="DC Flooring — how we work">
        </div>

        <div class="page quote dark-page" data-density="hard">
          <div class="eyebrow">Your Quote</div><h2 class="title">Itemised breakdown</h2>
          <div class="quotebox"><table><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Unit Price</th><th class="num">Total</th></tr></thead><tbody>${liRows}</tbody></table></div>
          <div class="totals"><div><span>Subtotal</span><span>${money(subtotal)}</span></div><div><span>VAT (20%)</span><span>${money(vat)}</span></div><div class="grand"><span>Total</span><span>${money(total)}</span></div></div>
          <div class="note">${escapeHtml(q.notes)}</div>
        <div class="pageno">04</div></div>

        <div class="page service dark-page" data-density="hard">
          <div class="eyebrow">Service</div><h2 class="title">What's included &amp; next steps</h2>
          <div class="svc-grid">
            <div class="svc-col"><h3>Included</h3><ul><li>Delivery to site or collection</li><li>Professional fitting</li><li>Aftercare guidance</li><li>Standard warranty</li></ul></div>
            <div class="svc-col"><h3>Next steps</h3><ul><li>Confirm your order</li><li>Book your fitting date</li><li>Site measure if required</li><li>Installation day</li></ul></div>
          </div>
          <div class="contact"><b>DC Flooring</b> — [Address line, placeholder]<br>[Phone number] · [Email address] · [Website]</div>
        <div class="pageno">05</div></div>

        <div class="page decision dark-page" id="decisionPage" data-density="hard"></div>
      </div>
    </div>
    <div class="controls">
      <button class="nav-btn" id="prevBtn">← Prev</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="nextBtn">Next →</button>
    </div>
  `;

  renderDecisionPage(q);
  wireBook();
}

function fmtDate(s){ if(!s) return '—'; const d = new Date(s+'T00:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); }

function renderDecisionPage(q){
  const el = document.getElementById('decisionPage');
  if(q.response){
    const cls = q.response.decision;
    el.innerHTML = `<div class="decision-inner"><div class="decided-state ${cls}">
      <div class="badge">${cls==='accepted'?'Quote accepted':'Quote declined'}</div>
      <div class="decided-msg">
        ${cls==='accepted' ? "Thanks — we've got your confirmation. We'll be in touch to get things booked in." : "Thanks for letting us know."}
        ${q.response.reason ? `<div style="margin-top:10px; font-style:italic;">"${escapeHtml(q.response.reason)}"</div>` : ''}
      </div>
    </div></div>`;
    return;
  }
  el.innerHTML = `
    <div class="decision-inner">
      <h2 class="title">What would you like to do?</h2>
      <p class="lead">Happy with the quote? Confirm below and we'll get your fitting booked in. If it's not quite right, let us know why.</p>
      <div class="decision-btns">
        <button class="dbtn accept" id="acceptBtn">Accept quote</button>
        <button class="dbtn decline" id="declineBtn">Decline</button>
      </div>
      <div class="decline-form" id="declineForm" style="display:none;">
        <textarea id="declineReason" placeholder="Tell us why — price, timing, changed your mind about the product..."></textarea>
        <button class="btn btn-primary">Submit</button>
      </div>
      <div class="decision-error" id="decisionError" role="alert"></div>
    </div>
  `;
  document.getElementById('acceptBtn').addEventListener('click', ()=> submitDecision(q, 'accepted', ''));
  document.getElementById('declineBtn').addEventListener('click', ()=>{
    document.getElementById('declineForm').style.display = 'block';
  });
  document.querySelector('#declineForm .btn').addEventListener('click', ()=>{
    const reason = document.getElementById('declineReason').value.trim();
    submitDecision(q, 'declined', reason);
  });
}

async function submitDecision(q, decision, reason){
  const busy = on=>{
    ['acceptBtn','declineBtn'].forEach(id=>{ const b = document.getElementById(id); if(b) b.disabled = on; });
    document.querySelectorAll('#declineForm .btn').forEach(b=> b.disabled = on);
  };
  const fail = text=>{ const e = document.getElementById('decisionError'); if(e) e.textContent = text; };
  fail(''); busy(true);
  let recorded = false;
  try{
    recorded = await rpc('submit_decision', { p_slug: q.shortSlug, p_decision: decision, p_reason: reason || null, p_reason_category: null });
  }catch(e){
    busy(false);
    fail("Sorry, we couldn't send that. Please check your connection and try again.");
    return;
  }
  // show what is actually stored: this also covers a quote that was already decided
  let fresh = null;
  try{ fresh = await getQuoteBySlug(q.shortSlug); }catch(e){}
  if(fresh){ q.status = fresh.status; q.response = fresh.response; }
  else if(recorded){ q.status = decision; q.response = { decision, reason, respondedAt: new Date().toISOString() }; }
  if(q.status === 'sent'){   // nothing was recorded and it is still open
    busy(false);
    fail('Sorry, something went wrong. Please try again.');
    return;
  }
  renderDecisionPage(q);
  if(!recorded && q.response && q.response.decision !== decision){
    const el = document.querySelector('#decisionPage .decided-state') || document.querySelector('.decided-state');
    if(el){ const n = document.createElement('div'); n.className = 'decided-note'; n.textContent = `This quote had already been ${q.response.decision}, so your response wasn't changed.`; el.appendChild(n); }
  }
}

/* ---------------- book (StPageFlip) ---------------- */
function wireBook(){
  const bookEl = document.getElementById('book');
  const pages = Array.from(bookEl.querySelectorAll('.page'));
  const total = pages.length;
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = pages.map((_,i)=>`<div class="dot" data-i="${i}"></div>`).join('');
  const dots = Array.from(dotsEl.children);
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  const PageFlipCtor = (window.St && window.St.PageFlip) || window.PageFlip;
  const pageFlip = new PageFlipCtor(bookEl, {
    width: 480,
    height: 672,
    size: 'stretch',
    minWidth: 260,
    maxWidth: 700,
    minHeight: 364,
    maxHeight: 980,
    maxShadowOpacity: 0.5,
    showCover: false,
    usePortrait: true,
    mobileScrollSupport: false
  });
  pageFlip.loadFromHTML(pages);

  function updateControls(){
    const idx = pageFlip.getCurrentPageIndex();
    dots.forEach((d,i)=> d.classList.toggle('active', i===idx));
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total-1;
  }
  pageFlip.on('flip', updateControls);
  updateControls();

  nextBtn.addEventListener('click', ()=> pageFlip.flipNext());
  prevBtn.addEventListener('click', ()=> pageFlip.flipPrev());
  dots.forEach(d=> d.addEventListener('click', ()=> pageFlip.flip(parseInt(d.dataset.i,10))));
}

/* ---------------- routing ---------------- */
function isPreview(){
  // "Preview as customer" opens the quote with ?preview=1 so admin views are never counted
  return new URLSearchParams(location.search).get('preview') === '1';
}
function siteBase(){
  // Site is served from a custom domain root (quotes.benchcreative.co.uk).
  return location.origin;
}
// The only public URL is a customer link: /q/<slug>. Everything else is the admin area and needs a login.
function routeMatch(){
  const m = location.pathname.match(/^\/q\/([^\/?#]+)\/?$/i);
  if(!m) return null;
  let value = m[1];
  try{ value = decodeURIComponent(value); }catch(e){}
  return { type:'slug', value };
}
function showLogin(){
  const login = document.getElementById('login');
  login.style.display = 'flex';
  document.getElementById('loginError').textContent = signedOutNotice;
  signedOutNotice = '';
  document.getElementById('loginPassword').value = '';
  const email = document.getElementById('loginEmail');
  if(document.activeElement !== document.getElementById('loginPassword')) email.focus();
}
async function route(){
  const adminEl = document.getElementById('admin');
  const customerEl = document.getElementById('customer');
  const loginEl = document.getElementById('login');
  const adminLink = document.getElementById('adminLink');
  const match = routeMatch();

  if(match){
    adminEl.style.display = 'none'; loginEl.style.display = 'none';
    customerEl.style.display = 'flex';
    adminLink.style.display = (isPreview() || session || readStoredSession()) ? 'block' : 'none';
    await renderCustomer(match);
    return;
  }

  // admin area: nothing at all is shown until there is a valid session
  customerEl.style.display = 'none'; adminLink.style.display = 'none';
  const token = await getAccessToken();
  if(!token){
    adminEl.style.display = 'none';
    if(token === undefined && !signedOutNotice) signedOutNotice = "Couldn't reach the server. Check your connection and try again.";
    showLogin();
    return;
  }
  loginEl.style.display = 'none';
  if(location.pathname !== '/' && location.pathname !== '/index.html') history.replaceState(null, '', '/');
  adminEl.style.display = 'flex';
  await renderList();
  if(!draft){
    const quotes = await listQuotes();
    if(quotes.length){ openEditor(quotes[0].ref); } else { document.getElementById('editorPane').innerHTML = '<div class="empty-list" style="padding-top:60px;">Create your first quote to get started.</div>'; }
  } else {
    renderEditor(); renderList();
  }
}

document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  if(!email || !password){ err.textContent = 'Enter your email and password.'; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
  const r = await signIn(email, password);
  btn.disabled = false; btn.textContent = 'Sign in';
  const pw = document.getElementById('loginPassword');
  if(!r.ok){ err.textContent = r.message; pw.value = ''; pw.focus(); return; }
  pw.value = '';
  route();
});
document.getElementById('logoutBtn').addEventListener('click', signOut);
document.getElementById('adminLink').addEventListener('click', e=>{
  e.preventDefault();
  history.pushState(null, '', siteBase() + '/');
  route();
});
window.addEventListener('popstate', route);
// signing in or out in another tab
window.addEventListener('storage', e=>{
  if(e.key !== SESSION_KEY || routeMatch()) return;   // customer pages don't care
  session = readStoredSession();
  if(!session) resetAdminState();
  route();
});
route();

// StPageFlip's loadFromHTML() clones the page content into its own managed DOM structure
// for the flip animation, and clones don't carry over JS event listeners — so a listener
// attached directly to the decline-reason textarea when it's first rendered (before
// wireBook() runs and clones it) never survives onto the copy that actually ends up on
// screen. StPageFlip also attaches its own (non-capturing) mousedown/touchstart handler on
// an ancestor of the page content to detect swipe drags, and calls preventDefault() on it,
// which blocks the browser's native focus-on-click for any form element underneath — so
// the textarea silently never receives focus and typed keystrokes go nowhere. Fixed with a
// single capturing-phase listener on `document`: capture always runs before an ancestor's
// bubble-phase listener gets a chance, and delegation via `document` doesn't depend on the
// specific (possibly-cloned) textarea node, so it works regardless of when/how the flipbook
// rebuilds the page DOM.
['mousedown','touchstart'].forEach(evt=>{
  document.addEventListener(evt, e=>{
    if(e.target && e.target.id === 'declineReason') e.stopPropagation();
  }, true);
});
</script>
