<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floors for Living — Quotes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@500;600&display=swap');
/* "Garet" isn't available on Google Fonts or Fontshare (checked both — it's a commercial font,
   not freely CDN-hosted). Using Poppins as a clean geometric-sans fallback for the dark pages'
   headings; swap the font-family below for the real thing if a licensed copy becomes available. */

:root{
  --bark:#241a14; --walnut:#3c2c22; --oak:#a97e4f; --brass:#b08d57;
  --linen:#f3ede1; --linen-soft:rgba(243,237,225,.62); --paper:#faf6ee; --ink:#2a2019; --ink-soft:#6b5c4d; --line:#d9cbb2;
  --ok:#4c6b4f; --bad:#a1493f;
}
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; background:var(--linen); font-family:'Work Sans',sans-serif; color:var(--ink); }
button{ font-family:inherit; }
::selection{ background:var(--brass); color:#fff; }

/* ===== shared bits ===== */
.eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--oak); margin:0 0 6px; }
.mono{ font-family:'IBM Plex Mono',monospace; }
h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0; }
.pill{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:20px; }
.pill.draft{ background:#e5dbc7; color:var(--ink-soft); }
.pill.sent{ background:#e0d3ba; color:var(--walnut); }
.pill.accepted{ background:#dbe6dc; color:var(--ok); }
.pill.declined{ background:#f0dcd9; color:var(--bad); }
.pill.expired{ background:#efe0c8; color:#8a5a14; }

/* ===== LOGIN ===== */
#login{ display:none; min-height:100vh; align-items:center; justify-content:center; padding:24px 16px; background:#272727; color:var(--linen); }
.login-card{ width:100%; max-width:360px; display:flex; flex-direction:column; gap:6px; }
.login-logo{ display:block; width:150px; align-self:center; aspect-ratio:8/5; object-fit:cover; object-position:50% 46%; mix-blend-mode:lighten; }
.login-title{ margin:2px 0 20px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); }
.login-card label{ margin-top:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--linen-soft); }
.login-card input{ width:100%; padding:11px 12px; border:1px solid #4a4a4a; border-radius:4px; background:#1d1d1d; color:var(--linen); font-family:'Work Sans',sans-serif; font-size:16px; }
.login-card input:focus{ outline:none; border-color:var(--brass); }
.login-error{ min-height:20px; margin:10px 0 6px; font-size:13px; line-height:1.4; color:#e8a398; }
.login-card .btn{ width:100%; padding:12px; }

/* ===== ADMIN ===== */
#admin{ display:none; min-height:100vh; }
.admin-body{ display:flex; width:100%; min-width:0; max-width:1560px; margin:0 auto; gap:0; min-height:100vh; }   /* min-width:0: a flex item otherwise can't shrink below its content (e.g. a nowrap line) */
.admin-main{ flex:1; min-width:0; display:flex; }
.sidebar{
  width:190px; flex-shrink:0; background:#272727; color:var(--linen);
  display:flex; flex-direction:column; padding:26px 0 18px;
  position:sticky; top:0; height:100vh; align-self:flex-start; overflow-y:auto;
}
.sidebar-top{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:0 18px 20px; text-align:center; }
.sidebar .sidebar-logo{ display:block; width:100%; max-width:150px; height:auto; aspect-ratio:8/5; object-fit:cover; object-position:50% 46%; mix-blend-mode:lighten; }
.sidebar .tagline{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav-item{
  position:relative; display:flex; align-items:center; gap:12px; padding:11px 16px 11px 18px;
  border-left:3px solid transparent; color:var(--linen-soft); text-decoration:none; font-size:13.5px; font-weight:500;
}
.nav-item:hover{ background:rgba(255,255,255,.04); color:var(--linen); }
.nav-item.active{ background:rgba(255,255,255,.09); border-left-color:#b08d57; color:#fff; }
.nav-item svg{ width:19px; height:19px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.nav-badge{ margin-left:auto; min-width:19px; padding:1px 6px; border-radius:10px; background:var(--brass); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:10.5px; line-height:1.4; text-align:center; }
.nav-badge.zero{ background:rgba(255,255,255,.14); color:var(--linen-soft); }
.sidebar-bottom{ margin-top:auto; padding:16px 18px 0; text-align:center; }
.logout-link{ padding:0; background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--linen-soft); text-decoration:underline; cursor:pointer; }
.logout-link:hover{ color:var(--brass); }
.list-pane{ width:300px; min-width:0; flex-shrink:0; border-right:1px solid var(--line); padding:20px; background:var(--paper); }
.page-pane{ display:none; flex:1; min-width:0; padding:28px clamp(18px,2.6vw,40px) 44px; }
/* which panes each view shows */
#admin[data-view="dashboard"] .list-pane, #admin[data-view="dashboard"] .editor-pane,
#admin[data-view="settings"] .list-pane, #admin[data-view="settings"] .editor-pane{ display:none; }
#admin[data-view="dashboard"] #dashboardPane, #admin[data-view="settings"] #settingsPane{ display:block; }

.new-btn{
  width:100%; padding:11px; background:var(--brass); color:#fff; border:none; border-radius:4px;
  font-size:13px; font-weight:600; letter-spacing:.02em; cursor:pointer; margin-bottom:16px;
}
.new-btn:hover{ background:var(--oak); }

.list-search{
  width:100%; padding:8px 10px; margin-bottom:12px; border:1px solid var(--line); border-radius:4px;
  font-size:13px; font-family:'Work Sans',sans-serif; background:#fff; color:var(--ink);
}
.list-search:focus{ outline:none; border-color:var(--brass); }
.qcard{
  border:1px solid var(--line); border-radius:5px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
  background:#fff; transition:border-color 150ms;
}
.qcard:hover{ border-color:var(--brass); }
.qcard.active{ border-color:var(--brass); box-shadow:0 0 0 1px var(--brass); }
.qcard{ min-width:0; }
.qcard .row1{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:5px; }
.qcard .row1-left{ display:flex; gap:6px; align-items:center; flex:1 1 0; min-width:0; }
.qcard .row3{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px 8px; margin-top:4px; }
.qcard .actions{ display:flex; gap:6px; flex-wrap:wrap; }
.qcard .waiting{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.04em; color:var(--bad); }
.qcard .row1-right{ display:flex; align-items:center; gap:8px; flex:none; justify-content:flex-end; }
.view-badge{ display:inline-flex; align-items:center; gap:4px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ok); cursor:help; }
.view-badge svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.view-badge.none{ color:#b3a893; }
.list-section{ display:flex; justify-content:space-between; margin:16px 2px 8px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }
.list-section:first-child{ margin-top:2px; }
.copy-fu-btn{
  width:100%; margin-top:8px; padding:7px 10px; background:none; border:1px solid var(--brass); color:var(--brass);
  border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;
}
.copy-fu-btn:hover{ background:var(--brass); color:#fff; }
.qcard .ref{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qcard .name{ font-size:14px; font-weight:600; margin-bottom:2px; overflow-wrap:anywhere; }
.qcard .total{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }
.qcard .reason{ font-size:11px; color:var(--bad); margin-top:6px; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qcard.is-hidden{ opacity:.5; }
.hide-btn{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
  background:none; border:1px solid var(--line); color:var(--ink-soft); padding:2px 7px; border-radius:10px; cursor:pointer;
}
.hide-btn:hover{ border-color:var(--brass); color:var(--brass); }
.del-btn{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
  background:none; border:1px solid var(--line); color:var(--bad); padding:2px 7px; border-radius:10px; cursor:pointer;
}
.del-btn:hover{ border-color:var(--bad); background:var(--bad); color:#fff; }
.qcard-check{ display:flex; align-items:center; cursor:pointer; margin-right:2px; }
.qcard-check input{ cursor:pointer; }
.empty-list{ font-size:12.5px; color:var(--ink-soft); text-align:center; padding:24px 8px; }

.select-all-row{ margin:-6px 0 10px; }
.bulk-bar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#f7ece9; border:1px solid #edd0ca; border-radius:5px; padding:9px 11px; margin-bottom:12px;
  font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;
}
.bulk-del-btn{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
  background:var(--bad); color:#fff; border:none; padding:6px 11px; border-radius:4px; cursor:pointer;
}
.bulk-del-btn:hover{ background:#8a3a32; }

.list-filters{ margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line); }
.date-filter{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.date-filter input{
  flex:1; min-width:0; padding:6px 7px; border:1px solid var(--line); border-radius:4px; font-size:11.5px;
  font-family:'IBM Plex Mono',monospace; background:#fff; color:var(--ink);
}
.date-filter .to-sep{ font-size:11px; color:var(--ink-soft); }
.hidden-toggle{
  display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
}
.hidden-toggle input{ cursor:pointer; }

.editor-pane{ flex:1; min-width:0; padding:28px 36px; }
.editor-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:11px; font-family:'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
.field input, .field textarea, .field select{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:4px; font-size:13.5px;
  font-family:'Work Sans',sans-serif; background:#fff; color:var(--ink);
}
.field textarea{ resize:vertical; min-height:64px; }
.details-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
.details-grid .field-name{ grid-column:1 / -1; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.section-title{ font-size:13px; font-weight:600; margin:10px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line); font-family:'Fraunces',serif;}
.li-table{ width:100%; table-layout:fixed; border-collapse:collapse; font-size:13px; }
.li-table col.c-qty{ width:13%; } .li-table col.c-unit{ width:20%; } .li-table col.c-total{ width:23%; } .li-table col.c-rm{ width:30px; }
.li-table thead th{
  background:none; border-bottom:1px solid var(--line); padding:0 4px 6px; text-align:left;
  font-size:10px; letter-spacing:.08em; color:var(--ink-soft);
}
.li-table thead th.num{ text-align:right; }
.li-table tbody td{ padding:4px; border-bottom:none; vertical-align:middle; }
.li-table input{
  width:100%; min-width:0; padding:8px 7px; border:1px solid var(--line); border-radius:4px; font-size:13px;
  font-family:'Work Sans',sans-serif; background:#fff; color:var(--ink);
}
.li-table input.li-qty, .li-table input.li-price{ text-align:right; }
.li-table td.li-total{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); text-align:right; white-space:nowrap; }
.rm-btn{ background:none; border:none; color:var(--bad); cursor:pointer; font-size:16px; width:100%; padding:0; }
.li-help{ font-size:11.5px; color:var(--ink-soft); margin:6px 4px 10px; line-height:1.5; }
.add-row-btn{ font-size:12px; color:var(--brass); background:none; border:1px dashed var(--line); padding:8px; width:100%; border-radius:4px; cursor:pointer; }
.add-row-btn:hover{ border-color:var(--brass); }

.editor-grid{ display:block; }
.editor-summary{ margin-top:24px; padding:16px 18px; background:var(--paper); border:1px solid var(--line); border-radius:6px; }
.totals-box{ margin:0 0 12px; font-family:'IBM Plex Mono',monospace; font-size:13px; }
.totals-box div{ display:flex; justify-content:space-between; padding:5px 0; color:var(--ink-soft); }
.totals-box .grand{ color:var(--ink); font-weight:600; border-top:1px solid var(--line); margin-top:4px; padding-top:9px; font-size:15px; }
.save-state{ display:flex; align-items:center; gap:10px; min-height:20px; margin-bottom:8px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; }
.unsaved-flag{ display:inline-flex; align-items:center; gap:6px; color:#8a5a14; }
.unsaved-flag::before{ content:""; width:7px; height:7px; border-radius:50%; background:#d19a3a; }
.unsaved-flag[hidden]{ display:none; }
.sum-actions{ display:flex; flex-wrap:wrap; gap:8px; }
.sum-actions .btn{ padding:10px 12px; }
.sum-actions .btn-primary{ flex:1 1 100%; }
.sum-actions .btn-ghost{ flex:1 1 130px; }
.btn{ padding:10px 18px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }
.btn:disabled{ opacity:.6; cursor:default; }
.btn-primary{ background:var(--brass); color:#fff; }
.btn-primary:hover{ background:var(--oak); }
.btn-ghost{ background:none; border-color:var(--line); color:var(--ink); }
.btn-ghost:hover{ border-color:var(--brass); color:var(--brass); }
.link-box{ display:flex; gap:8px; align-items:center; margin-top:14px; }
.link-box input{ flex:1; min-width:0; padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; border:1px solid var(--line); border-radius:4px; background:#fff; }
.link-box .btn{ padding:8px 12px; }
.views-detail{ margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:11.5px; line-height:1.55; color:var(--ink-soft); }
.link-note{ font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.5; }
.response-box{ margin-top:22px; padding:14px 16px; border-radius:5px; }
.response-box.accepted{ background:#eaf1eb; }
.response-box.declined{ background:#f7ece9; }
.response-box .rt{ font-size:13px; font-weight:600; margin-bottom:4px; }
.response-box .rr{ font-size:12.5px; color:var(--ink-soft); }
.saved-flash{ font-size:12px; color:var(--ok); font-family:'IBM Plex Mono',monospace; opacity:0; transition:opacity 200ms; }
.saved-flash.show{ opacity:1; }

/* ===== DASHBOARD + SETTINGS ===== */
.page-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px 20px; margin-bottom:22px; }
.page-head h1{ font-size:26px; }
.period{ display:inline-flex; max-width:100%; overflow-x:auto; border:1px solid var(--line); border-radius:6px; background:#fff; }
.period button{ padding:8px 14px; background:none; border:none; border-right:1px solid var(--line); font-size:12.5px; font-weight:500; color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
.period button:last-child{ border-right:none; }
.period button:hover{ color:var(--ink); }
.period button.active{ background:var(--brass); color:#fff; }
.panel{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:22px; }
.panel h2{ font-size:16px; margin:0 0 2px; }
.cap{ margin:0 0 14px; font-size:11.5px; line-height:1.5; color:var(--ink-soft); }
.att-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; }
.att-col h3{ margin:0; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); display:flex; justify-content:space-between; }
.att-col h3 span{ color:var(--ink-soft); }
.na-row{ margin-top:8px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--paper); cursor:pointer; }
.na-row:hover{ border-color:var(--brass); }
.na-top{ display:flex; justify-content:space-between; gap:10px; }
.na-name{ font-size:13.5px; font-weight:600; overflow-wrap:anywhere; }
.na-value{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; white-space:nowrap; }
.na-meta{ margin-top:3px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; line-height:1.5; color:var(--ink-soft); overflow-wrap:anywhere; }
.na-row .copy-fu-btn{ margin-top:8px; padding:5px 8px; font-size:11.5px; }
.na-empty{ padding:10px 0 2px; font-size:12.5px; line-height:1.5; color:var(--ink-soft); }
.na-more{ margin-top:8px; font-size:11.5px; color:var(--ink-soft); }
.kpis{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:22px; }
.kpi{ min-width:0; padding:16px 18px; background:#fff; border:1px solid var(--line); border-radius:8px; }
.k-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }
.k-value{ margin:6px 0 2px; font-family:'Fraunces',serif; font-size:28px; font-weight:600; line-height:1.15; overflow-wrap:anywhere; }
.k-value.dim{ color:#b3a893; }
.k-sub{ font-size:12.5px; color:var(--ink); }
.k-sub small{ display:block; margin-top:2px; font-size:11.5px; color:var(--ink-soft); }
.k-cap{ margin-top:10px; font-size:11px; line-height:1.45; color:var(--ink-soft); }
.chart{ display:flex; gap:clamp(4px,1.4vw,16px); height:210px; }
.wk{ flex:1; min-width:0; display:flex; flex-direction:column; }
.bars{ flex:1; display:flex; align-items:flex-end; justify-content:center; gap:3px; padding-top:18px; border-bottom:1px solid #cdbfa5; }
.bar{ position:relative; width:min(20px,42%); min-height:2px; border-radius:3px 3px 0 0; }
.bar.sent{ background:var(--brass); }
.bar.won{ background:var(--ok); }
.bar i{ position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-style:normal; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink); }
.wk-label{ height:24px; padding-top:6px; text-align:center; font-size:10.5px; color:var(--ink-soft); white-space:nowrap; }
.legend{ display:flex; gap:16px; margin-top:6px; font-size:11.5px; color:var(--ink-soft); }
.legend span::before{ content:""; display:inline-block; width:10px; height:10px; margin-right:6px; border-radius:2px; vertical-align:-1px; }
.legend .l-sent::before{ background:var(--brass); } .legend .l-won::before{ background:var(--ok); }
.dash-foot{ font-size:11.5px; color:var(--ink-soft); }
.settings-form{ max-width:660px; }
.settings-form .panel{ margin-bottom:18px; }
.settings-form .field input, .settings-form .field textarea{ font-size:14px; }
.settings-form .hint{ margin:-8px 0 14px; font-size:11.5px; line-height:1.5; color:var(--ink-soft); }
.settings-actions{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.settings-msg{ font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:var(--ok); }
.settings-msg.err{ color:var(--bad); }
.settings-notice{ margin-bottom:18px; padding:12px 14px; border:1px solid #edd0ca; border-radius:6px; background:#f7ece9; font-size:13px; line-height:1.5; }
.settings-notice .btn{ margin-top:8px; }
.settings-logout{ display:none; margin-top:26px; }

/* mobile: list, then one quote full screen */
.editor-back{ display:none; align-items:center; gap:6px; margin:0 0 14px; padding:8px 12px 8px 8px; background:none; border:1px solid var(--line); border-radius:6px; font-family:'Work Sans',sans-serif; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; }
.editor-back span{ font-size:20px; line-height:1; }
.list-head h2{ margin:0 0 4px; font-size:17px; }
.list-head .cap{ margin-bottom:12px; }
/* decision recorded by staff */
.staff-tag{ display:inline-block; margin-top:6px; padding:2px 8px; border:1px solid var(--line); border-radius:10px; background:var(--linen); font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.03em; color:var(--ink-soft); }
.decision-box{ margin-top:12px; }
.decision-box .views-detail{ margin-top:8px; padding-top:0; border-top:none; }
.decision-box .staff-tag{ margin-top:0; }
.decision-box .staff-note{ font-style:italic; overflow-wrap:anywhere; }
.rec-btns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.rec-btns .btn{ flex:1 1 130px; padding:9px 10px; font-size:12.5px; }
.modal-back{ position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(36,26,20,.55); }
.modal{ width:100%; max-width:420px; max-height:100%; overflow:auto; padding:20px 22px; background:var(--paper); border-radius:10px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
.modal h3{ margin:0 0 2px; font-family:'Fraunces',serif; font-size:20px; }
.modal-sub{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); overflow-wrap:anywhere; }
.modal-q{ margin:16px 0 8px; font-size:14px; font-weight:600; }
.method-row{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.method{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:6px; font-size:14px; cursor:pointer; }
.method:has(input:checked){ border-color:var(--brass); box-shadow:0 0 0 1px var(--brass); }
.modal-note{ display:block; margin:14px 0 6px; font-size:12px; color:var(--ink-soft); }
.modal textarea{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:4px; font-family:'Work Sans',sans-serif; font-size:14px; resize:vertical; }
.modal-err{ min-height:18px; margin-top:6px; font-size:12.5px; color:var(--bad); }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:8px; }
/* Needs attention header: a plain heading on desktop, a collapse toggle on phones */
.na-head{ display:flex; align-items:center; gap:10px; width:100%; margin:0; padding:0; background:none; border:none; font:inherit; font-size:16px; font-weight:700; color:inherit; text-align:left; cursor:default; }
.na-head:disabled{ color:inherit; }
.na-total, .na-head .chev{ display:none; }
.na-total{ min-width:22px; padding:1px 7px; border-radius:10px; background:var(--brass); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:500; text-align:center; }
.na-head .chev{ width:20px; height:20px; margin-left:auto; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .15s; }
/* chase / snooze / extend */
.card-actions{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.act-btn{ padding:4px 9px; background:none; border:1px solid var(--line); border-radius:4px; font-family:'Work Sans',sans-serif; font-size:11.5px; color:var(--ink); cursor:pointer; white-space:nowrap; }
.act-btn:hover{ border-color:var(--brass); color:var(--brass); }
.menu-wrap{ position:relative; display:inline-block; }
.menu{ position:absolute; z-index:40; top:100%; left:0; margin-top:4px; min-width:150px; padding:4px; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 8px 24px rgba(36,26,20,.18); }
.menu[hidden]{ display:none; }
.menu.right{ left:auto; right:0; }
.menu button{ display:block; width:100%; padding:8px 10px; background:none; border:none; border-radius:4px; text-align:left; font-family:'Work Sans',sans-serif; font-size:12.5px; color:var(--ink); cursor:pointer; }
.menu button:hover{ background:var(--linen); }
.menu-date{ display:block; padding:6px 10px 8px; border-top:1px solid var(--line); margin-top:4px; font-size:11.5px; color:var(--ink-soft); }
.menu-date input{ display:block; width:100%; margin-top:4px; padding:6px; border:1px solid var(--line); border-radius:4px; font-size:13px; font-family:'IBM Plex Mono',monospace; }
.chased{ margin-top:4px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); }
.snz{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
.snz-toggle{ padding:0; background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); cursor:pointer; }
.snz-toggle:hover{ color:var(--brass); }
.snz-list{ margin-top:6px; }
.snz-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--paper); cursor:pointer; }
.snz-row:hover{ border-color:var(--brass); }
.snz-info{ flex:1; min-width:0; }
.snz-row .act-btn{ flex:none; }
.chase-box{ margin-top:12px; }
.chase-box .views-detail{ margin:0 0 8px; }
.toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:200; display:flex; align-items:center; gap:14px; max-width:min(92vw,460px); padding:11px 14px; background:#272727; color:var(--linen); border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.35); font-size:13px; line-height:1.4; }
.toast[hidden]{ display:none; }
.toast-msg{ min-width:0; overflow-wrap:anywhere; }
.toast-undo{ flex:none; padding:5px 10px; background:none; border:1px solid var(--brass); border-radius:4px; color:var(--brass); font-size:12px; font-weight:600; cursor:pointer; }
.toast-undo:hover{ background:var(--brass); color:#fff; }
/* status chips above the Quotes list */
.status-chips{ display:flex; flex-wrap:wrap; gap:6px; min-width:0; margin:0 0 12px; }
.chip{ display:inline-flex; align-items:center; gap:6px; flex:none; padding:5px 10px; background:#fff; border:1px solid var(--line); border-radius:14px; font-family:'Work Sans',sans-serif; font-size:12px; color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
.chip:hover{ border-color:var(--brass); color:var(--ink); }
.chip.active{ background:var(--brass); border-color:var(--brass); color:#fff; }
.chip-n{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.8; }

/* ===== CUSTOMER (booklet) ===== */
#customer{ display:none; min-height:100vh; align-items:center; justify-content:center; padding:48px 16px;
  background:radial-gradient(ellipse at 50% -10%, #4a372a 0%, var(--bark) 55%), var(--bark); }
.stage{ width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:22px; }
.book-wrap{ position:relative; width:100%; aspect-ratio:1000/1400; }
.spine-shadow{ position:absolute; inset:0; border-radius:6px; box-shadow:0 30px 60px -20px rgba(0,0,0,.65), 0 10px 25px -10px rgba(0,0,0,.5); pointer-events:none; z-index:-1; }
.book-back{ position:absolute; inset:0; background:#272727; border-radius:6px; }
#book{ width:100%; height:100%; }
.page{ position:relative; height:100%; padding:26px 22px 22px 32px; display:flex; flex-direction:column; overflow:hidden auto; background:var(--paper); border-radius:6px; border:1px solid var(--line); }
.page::before{ content:""; position:absolute; top:0; left:0; bottom:0; width:18px; background:linear-gradient(to right, rgba(36,26,20,.16), transparent); z-index:1; }
.page.img-page{ padding:0; overflow:hidden; }
.page-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.cover-fields{ position:absolute; left:48%; width:40%; top:85.5%; text-align:right; display:flex; flex-direction:column; gap:.15em; line-height:1.15; color:#f3ede1; font-family:'IBM Plex Mono',monospace; z-index:2; }
.cover-fields .cf-name{ font-size:.85em; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cover-fields .cf-ref, .cover-fields .cf-date{ font-size:.68em; color:#d8c8ae; white-space:nowrap; }
.cover{ background:radial-gradient(120% 90% at 15% 0%, #4d3826 0%, transparent 55%), linear-gradient(155deg, var(--walnut), var(--bark) 70%); color:var(--linen); justify-content:space-between; padding-left:56px; }
.cover .mark{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.3em; color:var(--brass); text-transform:uppercase; }
.cover h1{ font-family:'Fraunces',serif; font-weight:600; font-size:clamp(34px,5.5vw,52px); line-height:1.02; margin:16px 0 0; }
.cover .rule{ width:64px; height:2px; background:var(--brass); margin:20px 0; }
.cover .sub{ font-size:13.5px; color:#d8c8ae; max-width:340px; line-height:1.55; }
.cover .meta{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#cbb896; line-height:1.9; }
.cover .meta b{ color:var(--linen); font-weight:500; }
h2.title{ font-family:'Fraunces',serif; font-weight:600; font-size:28px; margin:0 0 16px; color:var(--ink); }
.pageno{ position:absolute; bottom:16px; right:56px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); letter-spacing:.1em; }
.about p{ font-size:14px; line-height:1.7; color:var(--ink-soft); max-width:60ch; }
.streams{ display:flex; gap:12px; margin-top:18px; }
.stream{ flex:1; border:1px solid var(--line); border-radius:4px; padding:12px 13px 14px; background:linear-gradient(180deg,#fff,var(--paper)); }
.stream .n{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--brass); letter-spacing:.15em; }
.stream .t{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin:4px 0; }
.stream .d{ font-size:11.5px; color:var(--ink-soft); line-height:1.5; }
.quotebox{ border:1px solid var(--line); border-radius:4px; overflow:hidden; flex-shrink:0; }
table{ width:100%; border-collapse:collapse; font-size:12.5px; }
thead th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); background:var(--linen); padding:8px 11px; border-bottom:1px solid var(--line); }
tbody td{ padding:9px 11px; border-bottom:1px solid var(--line); color:var(--ink); }
tbody tr:last-child td{ border-bottom:none; }
td.num, th.num{ text-align:right; font-family:'IBM Plex Mono',monospace; }
.totals{ margin-top:12px; align-self:flex-end; width:220px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; flex-shrink:0; }
.totals div{ display:flex; justify-content:space-between; padding:4px 0; color:var(--ink-soft); }
.totals .grand{ color:var(--ink); font-weight:600; border-top:1px solid var(--line); margin-top:3px; padding-top:8px; font-size:14.5px; }
.note{ margin-top:14px; font-size:11px; color:var(--ink-soft); font-style:italic; white-space:pre-wrap; flex-shrink:0; }
.swatches{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:4px; }
.swatch{ border-radius:4px; overflow:hidden; border:1px solid var(--line); background:#fff; }
.swatch .tile{ height:64px; }
.t1{ background:repeating-linear-gradient(100deg,#a97e4f 0 10px,#8f6a41 10px 20px); }
.t2{ background:repeating-linear-gradient(45deg,#5b4331 0 8px,#6f5238 8px 16px); }
.t3{ background:linear-gradient(135deg,#c9bda3,#e4dcc9); }
.t4{ background:repeating-linear-gradient(90deg,#7a6a52 0 6px,#8c7a5f 6px 12px); }
.t5{ background:linear-gradient(135deg,#3c2c22,#5c4432); }
.t6{ background:repeating-linear-gradient(120deg,#c2a06b 0 12px,#b08d57 12px 24px); }
.swatch .cap{ padding:8px 9px 10px; }
.swatch .cap .p{ font-family:'Fraunces',serif; font-weight:600; font-size:12.5px; }
.swatch .cap .s{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-soft); margin-top:2px; }
.svc-grid{ display:flex; gap:24px; margin-top:4px; }
.svc-col{ flex:1; }
.svc-col h3{ font-family:'Fraunces',serif; font-size:14px; margin:0 0 9px; }
.svc-col ul{ margin:0; padding-left:0; list-style:none; }
.svc-col li{ font-size:12.5px; color:var(--ink-soft); line-height:1.65; padding-left:15px; position:relative; }
.svc-col li::before{ content:"—"; position:absolute; left:0; color:var(--brass); }
.contact{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); line-height:1.85; }
.contact b{ color:var(--ink); font-weight:500; }
.decision{ justify-content:center; align-items:center; text-align:center; }
/* StPageFlip forces inline display:block on the page element mid-flip, which defeats the
   .decision flex-centering above (justify/align-items only work on a flex container). Centering
   is done instead on this absolutely-positioned inner wrapper, which stays flex regardless. */
.decision-inner{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:26px 22px 22px 32px; box-sizing:border-box; }
.decision h2.title{ margin-bottom:8px; }
.decision p.lead{ font-size:13.5px; color:var(--ink-soft); max-width:44ch; margin:0 0 24px; }
.decision-btns{ display:flex; gap:12px; }
.dbtn{ padding:12px 22px; border-radius:5px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }
.dbtn.accept{ background:var(--ok); color:#fff; }
.dbtn.accept:hover{ background:#3f5a42; }
.dbtn.decline{ background:none; border-color:var(--bad); color:var(--bad); }
.dbtn.decline:hover{ background:var(--bad); color:#fff; }
.decline-form{ margin-top:20px; width:100%; max-width:380px; }
.decline-form textarea{ width:100%; min-height:80px; padding:10px 12px; border:1px solid var(--line); border-radius:4px; font-family:'Work Sans',sans-serif; font-size:13px; }
.decline-form .btn{ margin-top:10px; }
.decision-error{ margin-top:14px; max-width:38ch; font-size:12.5px; line-height:1.45; color:#df9c90; }
.decided-note{ margin-top:12px; font-size:12px; color:var(--linen-soft); }
.decided-state{ text-align:center; }
.decided-state .badge{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; padding:6px 14px; border-radius:20px; display:inline-block; margin-bottom:12px; }
.decided-state.accepted .badge{ background:#dbe6dc; color:var(--ok); }
.decided-state.declined .badge{ background:#f0dcd9; color:var(--bad); }
.decided-msg{ font-size:13px; max-width:38ch; }

/* ===== dark content pages: Quote / Service / Decision ===== */
.dark-page{ background:#272727; border-color:#3d3d3d; color:var(--linen); }
.dark-page::before{ background:linear-gradient(to right, rgba(0,0,0,.35), transparent); }
.dark-page .eyebrow{ font-family:'Poppins',sans-serif; font-weight:500; letter-spacing:.16em; color:var(--brass); }
.dark-page h2.title{ font-family:'Poppins',sans-serif; font-weight:500; text-transform:uppercase; letter-spacing:.02em; font-size:21px; color:#fff; }
.dark-page .pageno{ color:rgba(243,237,225,.4); }

.dark-page .quotebox{ border-color:#3d3d3d; }
.dark-page thead th{ background:#1d1d1d; color:var(--brass); border-bottom-color:#3d3d3d; }
.dark-page tbody td{ color:var(--linen); border-bottom-color:#3d3d3d; }
.dark-page .totals div{ color:var(--linen-soft); }
.dark-page .totals .grand{ color:var(--brass); border-top-color:#3d3d3d; }
.dark-page .note{ color:var(--linen-soft); }

.dark-page .swatch{ background:#1d1d1d; border-color:#3d3d3d; }
.dark-page .swatch .cap .p{ color:var(--linen); }
.dark-page .swatch .cap .s{ color:var(--linen-soft); }

.dark-page .svc-col h3{ color:var(--brass); }
.dark-page .svc-col li{ color:var(--linen-soft); }
.dark-page .contact{ color:var(--linen-soft); border-top-color:#3d3d3d; }
.dark-page .contact b{ color:var(--linen); }

.dark-page.decision p.lead{ color:var(--linen-soft); }
.dark-page .decided-msg{ color:var(--linen-soft); }
.dark-page .dbtn.decline{ border-color:#c96b5c; color:#df9c90; }
.dark-page .dbtn.decline:hover{ background:#c96b5c; color:#fff; }
.dark-page .decline-form textarea{ background:#1d1d1d; border-color:#3d3d3d; color:var(--linen); }

/* tightened spacing so Included/Next steps/contact all fit without scrolling */
.service .svc-grid{ gap:18px; margin-top:2px; }
.service .svc-col h3{ font-size:12px; margin:0 0 6px; }
.service .svc-col li{ font-size:11px; line-height:1.5; padding-left:12px; margin-bottom:1px; }
.service .contact{ padding-top:10px; font-size:9.5px; line-height:1.55; }
.service h2.title{ margin:0 0 10px; }

/* tightened spacing so long itemised breakdowns (8-10+ rows) keep totals visible;
   .page already has overflow:hidden auto as a scroll fallback beyond that */
.quote h2.title{ margin:0 0 10px; font-size:24px; }
.quote table{ font-size:11.5px; }
.quote thead th{ padding:6px 9px; font-size:9px; }
.quote tbody td{ padding:6px 9px; }
.quote .totals{ margin-top:8px; font-size:11.5px; }
.quote .totals div{ padding:3px 0; }
.quote .totals .grand{ margin-top:2px; padding-top:6px; font-size:13px; }
.quote .note{ margin-top:8px; font-size:10px; }
.controls{ display:flex; align-items:center; gap:16px; }
.nav-btn{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; background:transparent; color:var(--linen); border:1px solid #5a4433; padding:8px 15px; border-radius:3px; cursor:pointer; }
.nav-btn:hover:not(:disabled){ background:var(--brass); color:#241a14; border-color:var(--brass); }
.nav-btn:disabled{ opacity:.3; cursor:default; }
.dots{ display:flex; gap:6px; }
.dot{ width:6px; height:6px; border-radius:50%; background:#5a4433; }
.dot.active{ background:var(--brass); }
.not-found{ color:var(--linen); text-align:center; font-family:'IBM Plex Mono',monospace; font-size:13px; }
.admin-link{ position:fixed; bottom:14px; left:14px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:#7a6a52; text-decoration:none; letter-spacing:.05em; }

@media (min-width:1100px){
  .sidebar{ width:176px; }
  .list-pane{ width:270px; padding:18px; }
  .editor-pane{ padding:26px clamp(22px,2.4vw,36px); }
  .editor-grid{ display:grid; grid-template-columns:minmax(0,1fr) clamp(240px,22vw,300px); gap:clamp(22px,2vw,30px); align-items:start; }
  .editor-summary{ position:sticky; top:20px; margin-top:0; }
}
@media (max-width:1099px){
  /* side-by-side panes leave the editor too narrow below ~1100px, so the list sits above the editor */
  .admin-main{ flex-direction:column; }
  .list-pane{ width:100%; border-right:none; border-bottom:1px solid var(--line); }
  .att-grid{ grid-template-columns:1fr; }
  .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:800px){
  #admin[data-screen="list"] .editor-pane{ display:none; }
  #admin[data-screen="detail"] .list-pane{ display:none; }
  .editor-back{ display:inline-flex; }
  .na-help, .rem-help{ display:none; }
  .na-head{ cursor:pointer; }
  .na-total, .na-head .chev{ display:inline-block; }
  .na-head .chev{ display:block; }
  .na-panel.collapsed .na-body{ display:none; }
  .na-panel.collapsed .chev{ transform:rotate(-90deg); }
  .na-panel .na-body{ margin-top:10px; }
  .status-chips{ flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px; }
  .status-chips::-webkit-scrollbar{ display:none; }
  .toast{ bottom:calc(78px + env(safe-area-inset-bottom, 0px)); }
  /* the sidebar becomes a fixed bottom bar with the same four items */
  .admin-body{ flex-direction:column; padding-bottom:calc(66px + env(safe-area-inset-bottom, 0px)); }
  .sidebar{
    position:fixed; left:0; right:0; bottom:0; top:auto; z-index:60; width:100%; height:auto; align-self:auto;
    flex-direction:row; padding:0 0 env(safe-area-inset-bottom, 0px); overflow:visible; border-top:1px solid #3a3a3a;
  }
  .sidebar-top, .sidebar-bottom{ display:none; }
  .nav{ flex-direction:row; width:100%; gap:0; }
  .nav-item{
    flex:1; min-width:0; flex-direction:column; justify-content:center; gap:3px; padding:8px 2px 7px;
    border-left:0; border-top:2px solid transparent; font-size:10.5px; text-align:center;
  }
  .nav-item.active{ border-top-color:#b08d57; }
  .nav-item svg{ width:21px; height:21px; }
  .nav-badge{ position:absolute; top:3px; left:calc(50% + 6px); margin:0; min-width:16px; padding:0 4px; font-size:9.5px; }
  .settings-logout{ display:inline-block; }
}
@media (max-width:640px){
  .page-pane{ padding:20px 16px 36px; }
  .kpis{ gap:10px; }
  .kpi{ padding:12px 13px; }
  .k-value{ font-size:23px; }
  .panel{ padding:16px 14px; }
  .editor-pane{ padding:20px 16px; }
  .li-table col.c-qty{ width:14%; } .li-table col.c-unit{ width:22%; } .li-table col.c-total{ width:21%; } .li-table col.c-rm{ width:28px; }
  .li-table td.li-total{ font-size:11.5px; }
  .page{ padding:28px 24px 28px 38px; }
  .decision-inner{ padding:28px 24px 28px 38px; }
  .cover{ padding-left:38px; }
  .streams, .svc-grid{ flex-direction:column; }
  .swatches{ grid-template-columns:repeat(2,1fr); }
  .quote{ padding-top:18px; padding-bottom:14px; }

<script>
/* ---------------- settings ---------------- */
// Dashboard thresholds, all in one place so they are easy to change.
const DEFAULT_PERIOD = '30d';          // 'month' | '30d' | 'quarter' | 'all'
const EXPIRING_SOON_DAYS = 3;          // "Needs attention": valid-until is within this many days
const WARM_MIN_VIEWS = 2;              // "Needs attention": opened at least this many times, no decision yet
const NEVER_OPENED_AFTER_DAYS = 2;     // "Needs attention": sent more than this many days ago and never opened
const NEEDS_ATTENTION_MAX = 5;         // rows shown in each "Needs attention" list
const CHART_WEEKS = 8;                 // weeks shown in the sent vs accepted chart
const CHASE_SNOOZE_DAYS = 3;           // "Chased" keeps a quote out of Needs attention / Reminders for this many days
const SNOOZE_OPTIONS = [[1, '1 day'], [3, '3 days'], [7, '1 week']];   // the Snooze menu
const EXTEND_OPTIONS = [[7, '+7 days'], [14, '+14 days']];            // the Extend menu (plus "Pick a date")
const TOAST_MS = 8000;                 // how long the "Undo" toast stays up

  businessName:'', phone:'', email:'', address:'',

  reminderDays:5       // a sent quote shows under Reminders once it has waited longer than this
};

const BUSINESS = { businessName:'', phone:'', email:'', address:'' };
// The business name shown to staff and on printed quotes: Settings first, then "Floors for Living".
const brandName = ()=> (BUSINESS.businessName || '').trim() || BRAND_FALLBACK;
// What the customer pages show. Customers can't read the settings table, so this comes from get_business() (name, phone, email, address only).
const CUSTOMER_BUSINESS = { businessName:'', phone:'', email:'', address:'' };
const customerBrand = ()=> (CUSTOMER_BUSINESS.businessName || '').trim() || BRAND_FALLBACK;

/* ---------------- Supabase storage ---------------- */
const SUPABASE_URL = 'https://lpkdsdfltejgczsuvpay.supabase.co';
const SUPABASE_KEY = 'sb_publishable_v9LluInQJDNQmMHnbxixWQ_Otl-hvvG';
// The anon key is public by design. It can only sign in and call the customer functions
// (get_quote / record_view / submit_decision); the tables themselves need a signed-in user.
const ANON_HEADERS = { apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY };

/* ---------------- admin sign-in (Supabase Auth, email + password) ---------------- */
const SESSION_KEY = 'dcf.session';
let session = null;            // { access_token, refresh_token, expires_at (unix seconds) }
let signedOutNotice = '';      // shown on the login screen after an expired session
let refreshPromise = null;
const nowSec = ()=> Math.floor(Date.now()/1000);
function readStoredSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    return (s && s.access_token && s.refresh_token) ? s : null;
  }catch(e){ return null; }
}
function setSession(s){
  session = s;
  try{ if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }catch(e){ /* private mode: stay signed in for this tab only */ }
}
function jwtEmail(token){
  try{ return JSON.parse(atob(String(token).split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).email || ''; }catch(e){ return ''; }
}
function toSession(j, old){
  return { access_token:j.access_token, refresh_token:j.refresh_token, expires_at: j.expires_at || (nowSec() + (j.expires_in || 3600)),
           email: (j.user && j.user.email) || jwtEmail(j.access_token) || (old && old.email) || '' };
}
// the signed-in user's email, for "recorded by". Falls back to the token, then to asking Supabase Auth.
async function currentUserEmail(){
  await getAccessToken();
  if(!session) return '';
  if(session.email) return session.email;
  let email = jwtEmail(session.access_token);
  if(!email){
    try{
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + session.access_token } });
      if(res.ok){ const j = await res.json(); email = (j && j.email) || ''; }
    }catch(e){ /* handled by the caller */ }
  }
  if(email) setSession({ ...session, email });
  return email;
}
async function authCall(path, body){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  let json = null; try{ json = await res.json(); }catch(e){}
  return { ok:res.ok, status:res.status, json };
}
async function signIn(email, password){
  try{
    const r = await authCall('token?grant_type=password', { email, password });
    if(r.ok && r.json && r.json.access_token){ setSession(toSession(r.json)); sessionEnded = false; return { ok:true }; }
    const code = (r.json && (r.json.error_code || r.json.error)) || '';
    if(r.status === 429 || code === 'over_request_rate_limit') return { ok:false, message:'Too many attempts. Please wait a minute and try again.' };
    if(code === 'email_not_confirmed') return { ok:false, message:'Please confirm your email address before signing in.' };
    if(r.status >= 400 && r.status < 500) return { ok:false, message:"That email or password isn't right. Please try again." };
    return { ok:false, message:"Sorry, we couldn't sign you in just now. Please try again in a moment." };
  }catch(e){
    return { ok:false, message:"Couldn't reach the server. Check your connection and try again." };
  }
}
/* Returns an access token, null (not signed in / session ended) or undefined (couldn't reach the server,
   session kept). Refreshes shortly before expiry; if another tab already refreshed, uses its token. */
async function getAccessToken(force = false){
  if(!session) session = readStoredSession();
  if(!session) return null;
  if(!force && session.expires_at - 30 > nowSec()) return session.access_token;
  const stored = readStoredSession();
  if(stored && stored.access_token !== session.access_token && stored.expires_at - 30 > nowSec()){ session = stored; return session.access_token; }
  if(!refreshPromise){
    refreshPromise = (async()=>{
      try{
        const r = await authCall('token?grant_type=refresh_token', { refresh_token: session.refresh_token });
        if(r.ok && r.json && r.json.access_token){ setSession(toSession(r.json, session)); return session.access_token; }
        if(r.status >= 400 && r.status < 500){ setSession(null); return null; }   // refresh token rejected
        return undefined;
      }catch(e){ return undefined; }
      finally{ refreshPromise = null; }
    })();
  }
  return refreshPromise;
}
/* Every admin request goes through here and carries the signed-in user's token, never the anon key. */
async function adminFetch(path, opts = {}){
  const send = token => fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...opts, headers:{ apikey:SUPABASE_KEY, ...(opts.headers || {}), Authorization:'Bearer '+token } });
  let token = await getAccessToken();
  if(token === null){ endSession(); throw new Error('signed out'); }
  if(!token) throw new Error('could not reach the sign-in service');
  let res = await send(token);
  if(res.status === 401){
    token = await getAccessToken(true);
    if(token === null){ endSession(); throw new Error('signed out'); }
    if(!token) throw new Error('could not reach the sign-in service');
    res = await send(token);
    if(res.status === 401){ endSession(); throw new Error('signed out'); }
  }
  return res;
}
let sessionEnded = false;
function endSession(){
  if(sessionEnded) return;   // several requests can fail at once; only react once
  sessionEnded = true;
  setSession(null);
  signedOutNotice = 'Your session has ended. Please sign in again.';
  resetAdminState();
  route();
}
function resetAdminState(){
  draft = null; currentRef = null; quoteCache = null; selectedRefs = new Set();
  searchTerm = ''; filterFrom = ''; filterTo = ''; showHidden = false; listTab = 'all';
  isDirty = false;
  settings = { ...DEFAULT_SETTINGS }; settingsState = 'idle'; settingsPromise = Promise.resolve(); firstRenderDone = false;
  adminView = null; dashPeriod = DEFAULT_PERIOD;
  applySettings();
  ['qList','editorPane','dashboardPane','settingsPane'].forEach(id=>{ const el = document.getElementById(id); if(el) el.innerHTML = ''; });
  ['searchInput','filterFrom','filterTo'].forEach(id=>{ const el = document.getElementById(id); if(el) el.value = ''; });
  ['showHiddenChk','selectAllChk'].forEach(id=>{ const el = document.getElementById(id); if(el){ el.checked = false; el.indeterminate = false; } });
}
function signOut(){
  if(!confirmDiscard()) return;
  const token = session && session.access_token;
  setSession(null);
  signedOutNotice = '';
  resetAdminState();
  if(token) fetch(`${SUPABASE_URL}/auth/v1/logout?scope=local`, { method:'POST', headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+token } }).catch(()=>{});
  route();
}

/* Customer pages call these database functions with the anon key; they take the random short slug only. */
async function rpc(fn, args){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:'POST', headers:{ ...ANON_HEADERS, 'Content-Type':'application/json' }, body: JSON.stringify(args) });
  if(!res.ok) throw new Error(`${fn} failed (${res.status})`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function toDbRow(q, full){
  const row = {
    ref: q.ref,
    customer_name: q.customerName || '',
    date: q.date || null,
    valid_until: q.validUntil || null,
    line_items: q.lineItems || [],
    notes: q.notes || '',
    gallery: q.gallery || [],
    hidden: !!q.hidden,
    short_slug: q.shortSlug || null,
    updated_at: new Date().toISOString()
  };
  // status/response are only written when a quote is first created. After that the customer's decision
  // is owned by submit_decision(), and an open editor must never be able to overwrite it.
  if(full){ row.status = q.status || 'draft'; row.response = q.response || null; }
  return row;
}
function fromDbRow(r){
  return {
    ref: r.ref,
    customerName: r.customer_name || '',
    date: r.date || '',
    validUntil: r.valid_until || '',
    lineItems: (r.line_items && r.line_items.length) ? r.line_items : [{product:'',qty:'',unitPrice:''}],
    notes: r.notes || '',
    gallery: (r.gallery && r.gallery.length) ? r.gallery : [{name:'',ref:'',tex:'t1'}],
    status: r.status || 'draft',
    response: r.response || null,
    hidden: !!r.hidden,
    shortSlug: r.short_slug || null,
    createdAt: r.created_at,
    updatedAt: r.updated_at,
    firstViewedAt: r.first_viewed_at || null,
    lastViewedAt: r.last_viewed_at || null,
    viewCount: r.view_count || 0,
    lastChasedAt: r.last_chased_at || null,
    snoozedUntil: r.snoozed_until || null
  };
}

// Customer pages: one quote by its random short slug, via get_quote(). Returns null when there is no such quote
// and throws when the server can't be reached, so "not found" is never shown for a network problem.
// The public business details for the customer pages (name, phone, email, address): never fails the page.

// (and the editor's save never touches last_chased_at / snoozed_until). Resolves true only if a row was updated.
const DB_FIELD = { lastChasedAt:'last_chased_at', snoozedUntil:'snoozed_until', validUntil:'valid_until' };
async function patchQuote(ref, fields){
  const body = {};
  Object.keys(fields).forEach(k=>{ body[DB_FIELD[k]] = fields[k] || null; });
  try{
    const res = await adminFetch(`quotes?ref=eq.${encodeURIComponent(ref)}`, {
      method:'PATCH', headers:{ 'Content-Type':'application/json', Prefer:'return=representation' }, body: JSON.stringify(body)

/* Business settings (single row, id = 1). Loading never blocks the app: on any failure the defaults are used. */
let settings = { ...DEFAULT_SETTINGS };
let settingsState = 'idle';          // 'idle' | 'loading' | 'ok' | 'failed'
let settingsPromise = Promise.resolve();
function fromSettingsRow(r){
  const whole = (v, d, max)=>{ const n = Math.round(Number(v)); return Number.isFinite(n) && n >= 1 ? Math.min(n, max) : d; };
  return {
    businessName: r.business_name || '', phone: r.phone || '', email: r.email || '', address: r.address || '',
    defaultTerms: r.default_terms == null ? DEFAULT_SETTINGS.defaultTerms : String(r.default_terms),
    quoteValidDays: whole(r.quote_valid_days, DEFAULT_SETTINGS.quoteValidDays, 365),
    reminderDays: whole(r.reminder_days, DEFAULT_SETTINGS.reminderDays, 90)
  };
}
function toSettingsRow(x){
  const t = v=>{ v = (v || '').trim(); return v || null; };
  return { id:1, business_name:t(x.businessName), phone:t(x.phone), email:t(x.email), address:t(x.address),
           default_terms:x.defaultTerms, quote_valid_days:x.quoteValidDays, reminder_days:x.reminderDays,
           updated_at:new Date().toISOString() };
}
function applySettings(){
  BUSINESS.businessName = settings.businessName; BUSINESS.phone = settings.phone;
  BUSINESS.email = settings.email; BUSINESS.address = settings.address;
  if(!routeMatch()) document.title = `${brandName()} — Quotes`;

/* Customer view tracking: one record_view() call per page load. Best-effort, a failure never reaches the customer. */
const viewedThisLoad = new Set();
function recordView(slug){
  if(viewedThisLoad.has(slug)) return;
  viewedThisLoad.add(slug);
  rpc('record_view', { p_slug: slug }).catch(()=>{});
}
async function nextRef(){
  return 'DCF-' + Date.now().toString().slice(-6);
}
// The short slug is the only thing that gives a customer access to a quote, so it has to be unguessable:
// 10 characters from crypto.getRandomValues (about 58 bits), with rejection sampling so every character is
// equally likely. Older quotes keep their existing slugs.
const SLUG_LENGTH = 10;
function genSlug(len = SLUG_LENGTH){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const limit = 256 - (256 % chars.length);
  let s = '';
  while(s.length < len){
    for(const b of crypto.getRandomValues(new Uint8Array(len * 2))){
      if(b < limit && s.length < len) s += chars[b % chars.length];
    }
  }
  return s;
}

/* ---------------- defaults ---------------- */
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n);

}

    status:'draft', response:null, hidden:false, shortSlug: genSlug(),
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
}
function money(n){ return '£' + (isNaN(n)?0:n).toFixed(2); }
function calcTotals(q){
  const subtotal = q.lineItems.reduce((s,li)=>{
    const qty = parseFloat(li.qty), price = parseFloat(li.unitPrice)||0;
    return s + (qty ? qty*price : price);
  },0);
  const vat = subtotal*0.2;
  return { subtotal, vat, total: subtotal+vat };
}

/* ---------------- ADMIN render ---------------- */
let currentRef = null;
let draft = null;
let filterFrom = '';
let filterTo = '';
let showHidden = false;
let searchTerm = '';
let listTab = 'all';          // 'all' | 'reminders'
let statusFilter = 'all';     // Quotes list chip: 'all' | 'awaiting' | 'accepted' | 'declined' | 'expired' | 'draft'
const showSnoozed = { na:false, rem:false };   // whether the "Snoozed (n)" lists are open
let quoteCache = null;        // last list fetched from Supabase (search/filter/tab changes reuse it)
let selectedRefs = new Set();
let isDirty = false;          // editor has changes that haven't been saved
let editVersion = 0;          // bumps on every edit, so a save only clears "unsaved" if nothing changed meanwhile
let saving = false;
const DAY_MS = 86400000;

async function loadQuotes(force){
  if(force || quoteCache === null) quoteCache = await listQuotes();
  return quoteCache;
}
const STATUS_FILTERS = [['all','All'], ['awaiting','Awaiting reply'], ['accepted','Accepted'], ['declined','Declined'], ['expired','Expired'], ['draft','Draft']];
function matchesStatus(q, f){
  if(f === 'awaiting') return q.status === 'sent' && !isQuoteExpired(q);
  if(f === 'expired') return isQuoteExpired(q);
  if(f === 'accepted' || f === 'declined' || f === 'draft') return q.status === f;
  return true;
}
// Everything the Quotes list is filtered by: Show hidden, date range, search and (unless ignoreStatus) the status chip.
function visibleQuotes(all, ignoreStatus){
  const term = searchTerm.trim().toLowerCase();
  let quotes = all;
  if(!showHidden) quotes = quotes.filter(q=> !q.hidden);
  if(filterFrom) quotes = quotes.filter(q=> q.date && q.date >= filterFrom);
  if(filterTo) quotes = quotes.filter(q=> q.date && q.date <= filterTo);
  if(term) quotes = quotes.filter(q=> matchesSearch(q, term));
  if(!ignoreStatus && statusFilter !== 'all') quotes = quotes.filter(q=> matchesStatus(q, statusFilter));
  return quotes;
}
// a plain-words description of the active filters, used in the bulk-delete confirmation
function filterSummary(){
  const parts = [STATUS_FILTERS.find(([k])=> k === statusFilter)[1]];
  if(searchTerm.trim()) parts.push(`search '${searchTerm.trim()}'`);
  if(filterFrom || filterTo) parts.push(`dates ${filterFrom || '…'} to ${filterTo || '…'}`);
  if(showHidden) parts.push('including hidden');
  return parts.join(', ');
}
function matchesSearch(q, term){
  return (q.customerName||'').toLowerCase().includes(term) || (q.ref||'').toLowerCase().includes(term);
}

/* reminders: sent, not hidden, created more than settings.reminderDays ago, oldest first */
function quoteAgeDays(q){
  const t = Date.parse(q.createdAt || q.date || '');
  return isNaN(t) ? null : (Date.now() - t) / DAY_MS;
}
const isSnoozed = q => !!q.snoozedUntil && Date.parse(q.snoozedUntil) > Date.now();
function reminderCandidates(all){
  return all
    .filter(q=>{ const age = quoteAgeDays(q); return q.status==='sent' && !q.hidden && age!==null && age > settings.reminderDays; })
    .sort((a,b)=> quoteAgeDays(b) - quoteAgeDays(a));
}
// snoozed quotes are left out here, so the sidebar badge and the Reminders list always agree
function reminderQuotes(all){ return reminderCandidates(all).filter(q=> !isSnoozed(q)); }
function snoozedReminders(all){ return reminderCandidates(all).filter(isSnoozed).sort(bySnoozeEnd); }
function bySnoozeEnd(a, b){ return Date.parse(a.snoozedUntil) - Date.parse(b.snoozedUntil); }
function timeAgo(iso){
  const t = Date.parse(iso || '');
  if(isNaN(t)) return '';
  const mins = Math.floor((Date.now() - t) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins} minute${mins===1?'':'s'} ago`;
  const hours = Math.floor(mins / 60);
  if(hours < 24) return `${hours} hour${hours===1?'':'s'} ago`;
  const days = Math.floor(hours / 24);
  if(days < 30) return `${days} day${days===1?'':'s'} ago`;
  return 'on ' + fmtDate(new Date(t).toISOString().slice(0,10));
}
function viewsLabel(q){
  const n = q.viewCount || 0;
  if(!n) return 'Not opened';
  const ago = q.lastViewedAt ? timeAgo(q.lastViewedAt) : '';
  return `Opened ${n} ${n===1?'time':'times'}${ago ? ', last viewed ' + ago : ''}`;
}
const EYE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
// small eye + view count (muted when never opened); the full wording is the tooltip
function viewBadgeHtml(q){
  const n = q.viewCount || 0, label = viewsLabel(q);
  return `<span class="view-badge ${n ? '' : 'none'}" title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}">${EYE_SVG}${n}</span>`;
}
// "Expired" is worked out in the browser (sent + valid-until in the past); the stored status is never changed
function isQuoteExpired(q){ return q.status === 'sent' && isExpired(q); }
function displayStatus(q){
  return isQuoteExpired(q)
    ? { cls:'expired', label:'expired', tip:'Sent, but past its valid-until date' }
    : { cls:statusClass(q.status), label:q.status, tip:'' };
}
function pillHtml(q, style){
  const st = displayStatus(q);
  return `<span class="pill ${st.cls}"${st.tip ? ` title="${escapeHtml(st.tip)}"` : ''}${style ? ` style="${style}"` : ''}>${escapeHtml(st.label)}</span>`;
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
// the longer wording shown in the editor's summary panel
function viewsDetail(q){
  const n = q.viewCount || 0;
  if(!n) return 'Not opened yet.';
  const parts = [];
  if(q.firstViewedAt) parts.push(`First viewed ${fmtDateTime(q.firstViewedAt)}`);
  if(q.lastViewedAt) parts.push(`${parts.length ? 'last' : 'Last'} viewed ${fmtDateTime(q.lastViewedAt)}`);
  return `Opened ${n} ${n===1?'time':'times'}.${parts.length ? ' ' + parts.join(', ') + '.' : ''}`;
}
function quoteLink(q){
  return `${siteBase()}/q/${encodeURIComponent(q.shortSlug || '')}`;
}
function followUpMessage(q){
  const name = (q.customerName||'').trim();
  return `Hi ${name || 'there'}, hope you're well! Just checking in to see if you've had a chance to look over your flooring quote:\n\n${quoteLink(q)}\n\nAny questions at all, just let me know. Thanks!`;
}
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){ /* fall through to the legacy path */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed; top:0; left:0; opacity:0;';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}
// Copies the follow-up message for a quote; gives a quote that is missing its short link one first.
async function copyFollowUp(q, btn){
  if(!q.shortSlug){
    q.shortSlug = genSlug();
    if(!(await saveQuote(q))){ flashButton(btn, 'Copy failed'); return; }
  }
  const ok = await copyText(followUpMessage(q));
  flashButton(btn, ok ? 'Copied ✓' : 'Copy failed');
}
function flashButton(btn, text){
  if(!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = text;
  clearTimeout(btn._flashTimer);
  btn._flashTimer = setTimeout(()=>{ btn.textContent = btn.dataset.label; }, 1400);
}

/* ----- Recording a decision for the customer (they rang, or came into the shop). Written with the signed-in admin's
   session, never through the customer functions. ----- */
const RECORD_METHODS = [['phone', 'Phone'], ['in_shop', 'In shop'], ['email', 'Email'], ['other', 'Other']];
const isStaffRecorded = q => !!q.response && q.response.source === 'staff';
function staffLabel(q){
  const m = RECORD_METHODS.find(([k])=> k === (q.response && q.response.method));
  return 'Recorded by staff' + (m ? ` (${m[1].toLowerCase()})` : '');
}
const staffNote = q => isStaffRecorded(q) ? String(q.response.staff_note || '') : '';
// the "Decision" block in the editor's summary panel: record buttons while the quote is open, the recorded answer (and Reopen) once it isn't
function decisionBoxHtml(q){
  if(q.status === 'sent'){
    return `<div class="decision-box">
      <div class="views-detail">Customer rang or called in? Record their answer for them.</div>
      <div class="rec-btns"><button class="btn btn-ghost" id="recAcceptBtn" type="button">Record as accepted</button><button class="btn btn-ghost" id="recDeclineBtn" type="button">Record as declined</button></div>
    </div>`;
  }
  if(q.status !== 'accepted' && q.status !== 'declined') return '';
  const r = q.response || {}, when = r.respondedAt ? fmtDateTime(r.respondedAt) : '';
  const lines = [];
  if(isStaffRecorded(q)){
    lines.push(`<div class="staff-tag">${escapeHtml(staffLabel(q))}</div>`);
    lines.push(`<div class="views-detail">${escapeHtml(`${q.status === 'accepted' ? 'Accepted' : 'Declined'}${when ? ' on ' + when : ''}${r.recorded_by ? ' · recorded by ' + r.recorded_by : ''}`)}</div>`);

  return `<div class="decision-box">${lines.join('')}<div class="rec-btns"><button class="btn btn-ghost" id="reopenBtn" type="button">Reopen quote</button></div></div>`;

function closeRecordDialog(){
  const m = document.getElementById('recordModal');
  if(m) m.remove();
  document.removeEventListener('keydown', recordKeys);
}
function recordKeys(e){ if(e.key === 'Escape') closeRecordDialog(); }
function openRecordDialog(decision){
  if(!draft) return;
  closeRecordDialog();
  const acc = decision === 'accepted', ref = draft.ref;
  const wrap = document.createElement('div');
  wrap.id = 'recordModal'; wrap.className = 'modal-back';
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="recTitle">
    <h3 id="recTitle">Record as ${acc ? 'accepted' : 'declined'}</h3>
    <div class="modal-sub">${escapeHtml(quoteName(draft))} · ${escapeHtml(draft.ref)}</div>
    <p class="modal-q">How did they tell you?</p>
    <div class="method-row" role="radiogroup" aria-label="How did they tell you?">${RECORD_METHODS.map(([k, l], i)=>
      `<label class="method"><input type="radio" name="recMethod" value="${k}"${i === 0 ? ' checked' : ''}><span>${escapeHtml(l)}</span></label>`).join('')}</div>
    <label class="modal-note" for="recNote">${acc ? 'Note (optional)' : 'Reason (optional)'}</label>
    <textarea id="recNote" maxlength="1000" rows="3"></textarea>
    <div class="modal-err" id="recErr" role="alert"></div>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" id="recCancel">Cancel</button><button type="button" class="btn btn-primary" id="recConfirm">Confirm</button></div>
  </div>`;
  document.body.appendChild(wrap);
  document.addEventListener('keydown', recordKeys);
  wrap.addEventListener('click', e=>{ if(e.target === wrap) closeRecordDialog(); });
  document.getElementById('recCancel').addEventListener('click', closeRecordDialog);
  wrap.querySelector('input[name=recMethod]:checked').focus();
  document.getElementById('recConfirm').addEventListener('click', async ()=>{
    const btn = document.getElementById('recConfirm'), err = document.getElementById('recErr');
    const method = wrap.querySelector('input[name=recMethod]:checked').value;
    const note = document.getElementById('recNote').value.trim();
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Saving…';
    const email = await currentUserEmail();
    if(!email){ err.textContent = "Couldn't tell who you're signed in as. Please sign in again."; btn.disabled = false; btn.textContent = 'Confirm'; return; }
    const now = new Date().toISOString();
    const saved = await patchQuoteWhere(ref, {
      status: decision,
      response: { decision, respondedAt: now, source: 'staff', method, staff_note: note, recorded_by: email },
      updated_at: now
    }, 'status=eq.sent');
    if(saved === null){ err.textContent = "Couldn't save that. Please try again."; btn.disabled = false; btn.textContent = 'Confirm'; return; }
    closeRecordDialog();
    if(saved === false){ showToast('This quote has already been answered, so nothing was changed.'); }
    else showToast(`Recorded ${quoteName(saved)} as ${decision} (${(RECORD_METHODS.find(([k])=> k === method) || [])[1].toLowerCase()}).`);
    await afterDecisionChange(ref, saved || await getQuote(ref));
  });
}
async function reopenQuote(){
  if(!draft) return;
  const q = draft;
  if(!confirm(`Reopen quote ${q.ref}?\n\nIt goes back to "sent" and the recorded ${q.status === 'accepted' ? 'acceptance' : 'decline'} is cleared, so the customer link works again.` + (isExpired(q) ? '\n\nIt is past its valid-until date, so the customer still won\'t be able to answer until you extend it.' : ''))) return;
  const saved = await patchQuoteWhere(q.ref, { status:'sent', response:null, updated_at:new Date().toISOString() }, 'status=in.(accepted,declined)');
  if(saved === null){ alert("Couldn't reopen the quote. Please try again."); return; }
  showToast(saved ? `Reopened ${quoteName(saved)}.` : 'This quote has already been reopened.');
  await afterDecisionChange(q.ref, saved || await getQuote(q.ref));
}
// the editor and the lists pick up the new status / response (unsaved edits in the editor are kept)
async function afterDecisionChange(ref, fresh){
  if(fresh && draft && draft.ref === ref){ draft.status = fresh.status; draft.response = fresh.response; renderEditor(); }
  await renderList(true);
}
// PATCH with an extra filter, so a stale screen can never overwrite a newer state. Resolves the updated quote, false if no row
// matched the filter, or null if the request failed.
async function patchQuoteWhere(ref, body, filter){
  try{
    const res = await adminFetch(`quotes?ref=eq.${encodeURIComponent(ref)}&${filter}`, {
      method:'PATCH', headers:{ 'Content-Type':'application/json', Prefer:'return=representation' }, body: JSON.stringify(body)
    });
    if(!res.ok) return null;
    const rows = await res.json();
    return Array.isArray(rows) && rows.length ? fromDbRow(rows[0]) : false;
  }catch(e){ return null; }
}

/* ----- Chased / Snooze / Extend. Stored on the quote row in Supabase (last_chased_at, snoozed_until, valid_until),
   so the state survives a refresh and is the same for every user. Every change shows an Undo toast. ----- */
const EXTEND_TIP = "Extending also reopens an expired quote, because customers can't accept after the valid-until date.";
const quoteName = q => (q.customerName || '').trim() || q.ref;
const longDate = d => new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
function chasedLabel(q){
  if(!q.lastChasedAt) return '';
  const t = timeAgo(q.lastChasedAt);
  return t ? 'Chased ' + t : '';
}
function chaseDetail(q){
  const parts = [q.lastChasedAt ? `Last chased ${timeAgo(q.lastChasedAt) || 'earlier'}.` : 'Not chased yet.'];
  if(isSnoozed(q)) parts.push(`Snoozed until ${fmtDateTime(q.snoozedUntil)}.`);
  return parts.join(' ');
}
function menuHtml(kind, label, items, right, tip, extra){
  return `<span class="menu-wrap"><button type="button" class="act-btn" data-menu="${kind}" aria-haspopup="menu" aria-expanded="false"${tip ? ` title="${escapeHtml(tip)}"` : ''}>${escapeHtml(label)} ▾</button>
    <div class="menu${right ? ' right' : ''}" role="menu" hidden>${items}${extra || ''}</div></span>`;
}
// the action buttons under a Needs attention row / Reminders card; Extend is only offered in the "Expiring" list
function cardActionsHtml(q, withExtend){
  const ref = escapeHtml(q.ref);
  const snooze = SNOOZE_OPTIONS.map(([d, l])=> `<button type="button" role="menuitem" data-act="snooze" data-days="${d}" data-ref="${ref}">${escapeHtml(l)}</button>`).join('');
  let extend = '';
  if(withExtend){
    const items = EXTEND_OPTIONS.map(([d, l])=> `<button type="button" role="menuitem" data-act="extend" data-days="${d}" data-ref="${ref}">${escapeHtml(l)}</button>`).join('');
    const minDate = addDays(q.validUntil && q.validUntil > todayLondon() ? q.validUntil : todayLondon(), 1);
    const pick = `<label class="menu-date">Pick a date<input type="date" data-pick="extend" data-ref="${ref}" min="${escapeHtml(minDate)}"></label>`;
    extend = menuHtml('extend', 'Extend', items, true, EXTEND_TIP, pick);
  }
  return `<div class="card-actions">
    <button type="button" class="act-btn" data-act="chase" data-ref="${ref}" title="${escapeHtml(`Mark as chased. Keeps it out of the list for ${CHASE_SNOOZE_DAYS} days.`)}">Chased</button>
    ${menuHtml('snooze', 'Snooze', snooze, false, 'Keep it out of the list for a while')}${extend}
  </div>`;
}
function snoozedRowHtml(q){

    <div class="snz-info">
      <div class="na-top"><span class="na-name">${escapeHtml(q.customerName) || 'Unnamed customer'}</span><span class="na-value">${gbp0(quoteValue(q))}</span></div>
      <div class="na-meta">${escapeHtml(q.ref)} · Returns ${escapeHtml(longDate(q.snoozedUntil))}</div>
    </div>
    <button type="button" class="act-btn" data-act="unsnooze" data-ref="${escapeHtml(q.ref)}">Bring back</button>

// the "Snoozed (n)" toggle at the bottom of Needs attention (kind "na") and of Reminders (kind "rem")
function snoozedBlockHtml(kind, list){
